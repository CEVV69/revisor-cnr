<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseño de Desarenador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2545; --blue:#1e6091; --ice:#eef4fa; --frost:#f7fafc;
  --line:#d7e2ec; --ink:#14243b; --muted:#5b7086; --white:#ffffff;
  --ok:#1a7f4e; --warn:#b8860b; --bad:#c0392b; --orange:#c9701a;
  --radius:10px; --shadow:0 2px 10px rgba(11,37,69,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --navy:#0b2030; --blue:#4a9bd1; --ice:#152233; --frost:#101b28;
    --line:#26394d; --ink:#e7eef6; --muted:#93a6ba; --white:#182636;
    --ok:#3ecf8e; --warn:#e0b34d; --bad:#e5695a; --orange:#e2984a;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--frost);color:var(--ink);font-family:'Nunito',sans-serif;font-size:14px}
.topbar{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.topbar .title{font-weight:800;font-size:16px}
.topbar .sub{font-size:11.5px;opacity:.75;font-family:'DM Mono',monospace}
.topbar .sp{flex:1}
.topbar button{background:rgba(255,255,255,.12);border:0;color:#fff;font-family:inherit;font-weight:700;font-size:12px;padding:7px 12px;border-radius:7px;cursor:pointer}
.topbar button:hover{background:rgba(255,255,255,.22)}
.tabbar{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:49;box-shadow:0 1px 4px rgba(11,37,69,.05)}
.tabs{display:flex;gap:6px;max-width:1180px;margin:0 auto;padding:9px 14px;overflow-x:auto}
.tab{padding:7px 15px;border-radius:20px;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;font-size:12.8px;user-select:none;white-space:nowrap;transition:background .12s,color .12s}
.tab:hover{background:var(--ice);color:var(--navy)}
.tab.on{background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){.tab.on{background:var(--blue);color:#0b2030}}
.wrap{max-width:1180px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 22px}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:8px;margin:3px 0}
.row label{flex:1;font-size:13px;color:var(--ink);line-height:1.15}
.row.tight label{flex:0 0 auto}
.hint.sm{font-size:10.5px;display:block;margin:1px 0 0 2px}
.row .u{width:34px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
input,select{font-family:'Nunito',sans-serif;font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--white);color:var(--ink);width:104px;text-align:right}
select{width:196px;text-align:left}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
input.w140{width:168px}
input.result{background:var(--ice);font-family:'DM Mono',monospace;font-weight:500;border-style:dashed}
input::placeholder{color:var(--orange)}
input.nocalc::placeholder{color:var(--muted)}
.hint{font-size:11px;color:var(--muted);margin-left:4px}
.al{border-radius:7px;padding:6px 9px;font-size:12px;margin:6px 0;font-weight:600}
.al.b{background:rgba(192,57,43,.12);color:var(--bad)}
.al.w{background:rgba(184,134,11,.14);color:var(--warn)}
.al.o{background:rgba(26,127,78,.12);color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--ice);color:var(--navy);text-align:left;padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
@media (prefers-color-scheme: dark){th{color:var(--ink)}}
td{padding:5px 8px;border-bottom:1px solid var(--line)}
td.n{text-align:right;font-family:'DM Mono',monospace}
tr.sec td{background:var(--ice);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.4px}
tr.tot td{font-weight:800;background:var(--ice);border-top:2px solid var(--blue)}
.big{display:flex;align-items:baseline;gap:8px;background:var(--ice);border-radius:8px;padding:9px 12px;margin-top:8px}
.big b{font-size:20px;font-family:'DM Mono',monospace;color:var(--navy)}
@media (prefers-color-scheme: dark){.big b{color:var(--blue)}}
svg .ln{stroke:var(--muted);stroke-width:.7;fill:none}
svg .cot{stroke:var(--blue);stroke-width:.7;fill:none}
svg text{font-family:'DM Mono',monospace;font-size:9px;fill:var(--ink)}
svg .fillC{fill:var(--ice);stroke:var(--navy);stroke-width:1}
svg .fillW{fill:rgba(74,155,209,.25);stroke:none}
.ctr{text-align:center}
.btn{background:var(--blue);color:#fff;border:0;padding:6px 14px;border-radius:8px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer}
/* ---------- INFORME ---------- */
#reportView{display:none}
@page{size:letter;margin:0}
.inf-page{width:215.9mm;height:279.4mm;position:relative;background:#fff;margin:0 auto 6mm;box-shadow:0 0 8px rgba(0,0,0,.18);overflow:hidden}
.inf-pg{position:absolute;top:13mm;left:15mm;right:13mm;bottom:11mm;color:#14243b;font-size:10pt;line-height:1.35}
.inf-h{border-bottom:2px solid #0b2545;padding-bottom:3mm;margin-bottom:4mm}
.inf-h .t{font-size:16.5pt;font-weight:800;color:#0b2545}

.inf-h .s{font-size:9.5pt;color:#5b7086;font-family:'DM Mono',monospace}
.inf-s{font-size:10.5pt;font-weight:800;color:#1e6091;text-transform:uppercase;letter-spacing:.5px;margin:4mm 0 1.5mm;border-bottom:1px solid #d7e2ec;padding-bottom:1mm}
.inf-tbl{width:100%;border-collapse:collapse;font-size:9.5pt}
.inf-tbl th{background:#eef4fa;color:#0b2545;padding:1.2mm 2mm;text-align:left;font-size:8.5pt;border-bottom:1px solid #d7e2ec}
.inf-tbl td{padding:1.1mm 2mm;border-bottom:.5px solid #e6edf4;text-align:left;color:#14243b}
.inf-tbl td.n{text-align:right;font-family:'DM Mono',monospace}
.inf-tbl tr.tot td{font-weight:800;background:#eef4fa;border-top:1.2px solid #1e6091}
.inf-2{display:grid;grid-template-columns:1fr 1fr;gap:0 8mm}
.inf-kv{display:flex;justify-content:space-between;border-bottom:.5px dotted #ccd8e4;padding:.9mm 0;font-size:9.5pt}
.inf-kv b{font-family:'DM Mono',monospace;font-weight:400;color:#0b2545}
.inf-f{position:absolute;bottom:0;left:15mm;right:13mm;border-top:1px solid #d7e2ec;padding-top:1.5mm;font-size:8pt;color:#5b7086;display:flex;justify-content:space-between}
.keep{page-break-inside:avoid}
@media print{
  body{background:#fff}
  .topbar,.tabbar,.wrap{display:none!important}
  #reportView{display:block!important}
  .inf-page{margin:0;box-shadow:none;page-break-after:always}
  .inf-page:last-child{page-break-after:auto}
  #reportView,#reportView *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

/* ============ utilidades ============ */
function parseDecimalFlex(t){
  if(t===null||t===undefined)return NaN;
  let s=String(t).trim(); if(!s)return NaN;
  s=s.replace(/\s/g,'');
  const lc=s.lastIndexOf(','), lp=s.lastIndexOf('.');
  if(lc>-1&&lp>-1){ const d=Math.max(lc,lp);
    s=s.slice(0,d).replace(/[.,]/g,'')+'.'+s.slice(d+1);
  } else if(lc>-1){ s=s.replace(/,/g,'.'); }
  const v=parseFloat(s); return isNaN(v)?NaN:v;
}
function fmt(v,d){ d=(d===undefined)?2:d;
  if(v===null||v===undefined||isNaN(v)||!isFinite(v))return '—';
  return Number(v).toLocaleString('es-CL',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function money(v){ if(isNaN(v)||!isFinite(v))return '—';
  return '$ '+Math.round(v).toLocaleString('es-CL'); }

const DEF={

let S=JSON.parse(JSON.stringify(DEF));

const MALLAS=['C-92','C-111','C-139','C-158','C-221','C-257','C-295','C-335','C-378','C-443'];
function familia(dm){ return (dm>=0.05)?'Arena':(dm>=0.005)?'Limo':'Arcilla'; }
const ARM={
  Arena:{0.5:['C-92','C-92','C-92'],1:['C-92','C-92','C-139'],1.5:['C-257','C-295','C-295'],
         2:['C-295','C-378','Doble malla C-221'],2.5:['Doble malla C-257','Doble malla C-295','Doble malla C-295']},
  Limo:{0.5:['C-92','C-92','C-92'],1:['C-111','C-139','C-139'],1.5:['C-257','C-335','C-378'],
        2:['Doble malla C-221','Doble malla C-257','Doble malla C-295'],
        2.5:['Doble malla C-335','Doble malla C-378','Doble malla C-443']},
  Arcilla:{0.5:['C-92','C-92','C-92'],1:['C-111','C-139','C-158'],1.5:['C-295','C-378','C-378'],
           2:['C-257','Doble malla C-295','Doble malla C-335'],
           2.5:['Doble malla C-335','Doble malla C-443','Doble malla C-443']}
};
const OFF={'C-221':3147.271186440677,'C-295':297.2142857142857,'C-335':1755.7058111380145,
           'C-378':2092.027239709443,'C-443':4586.815375302663};

function factorUF(){
  const ub=parseDecimalFlex(S.ufBase), u=parseDecimalFlex(S.uf);
  if(isNaN(ub)||isNaN(u)||ub<=0||u<=0) return 1;
  return u/ub;
}
/* precios de tabla DT-18 (sin actualizar por UF) segun altura/acceso/km */
function baseTabla(){
  const g=PT[String(S.altura)+S.acceso];
  if(!g) return null;
  let i=Math.max(0,Math.min(29,Math.round(S.km/10)-1));
  const C92=g[2][i], C139=g[3][i], C257=g[4][i];
  const o={horm:g[0][i], mold:g[1][i]};
  o['C-92']=C92;
  o['C-111']=(C139+C92)/2;
  o['C-139']=C139;
  o['C-221']=C139+OFF['C-221'];
  o['C-158']=C139+(o['C-221']-C139)*(158-139)/(221-139);
  o['C-257']=C257;
  o['C-295']=C257+OFF['C-295'];
  o['C-335']=C257+OFF['C-335'];
  o['C-378']=C257+OFF['C-378'];
  o['C-443']=C257+OFF['C-443'];
  return o;
}
/* precio base efectivo: override manual si existe */
function precioBase(k){
  const bt=baseTabla(); if(!bt) return NaN;
  const ov=S.pb?S.pb[k]:undefined;
  if(ov!==undefined&&ov!==''&&ov!==null){ const v=parseDecimalFlex(ov); if(!isNaN(v)) return v; }
  return bt[k];
}
/* precio aplicado = base x factor UF */
function precioAp(k){ return precioBase(k)*factorUF(); }
/* precio de la armadura adoptada (duplica si es doble malla) */
function precioArm(nom){
  if(!nom) return NaN;
  const n=nom.replace('Doble malla ','');
  const doble=nom.indexOf('Doble')===0?2:1;
  return precioAp(n)*doble;
}

/* ============ motor hidráulico ============ */
function coefs(Re){
  return [ (24/Re)+(4/Math.pow(Re,1/3)),
           (24/Re)*(1+0.15*Math.pow(Re,0.687)),
           (24/Re)*Math.pow(1+(3/16)*Re,0.5),
           24/Re ];
}
function calcular(){
  const Q=parseDecimalFlex(S.Q), b=parseDecimalFlex(S.b), h=parseDecimalFlex(S.h);
  const d=Number(S.d)/1000, nu=0.001011, rho=1000;
  const r={Q:Q,b:b,h:h,ok:false,msg:[]};
  if(isNaN(Q)||isNaN(b)||isNaN(h)||Q<=0||b<=0||h<=0) return r;
  if(Q>2) r.msg.push(['b','El caudal de diseño debe ser ≤ 2 m³/s.']);
  if(h>1.8) r.msg.push(['b','La profundidad no puede superar 1,8 m.']);

  /* iteración Newton–Allen–Stokes (promedio Putnam/Schiller/Olson/Stokes) */
  let Wo=1, Re=0, Cprom=0;
  for(let i=0;i<30;i++){
    Re=(rho*Wo*d)/nu;
    const c=coefs(Re);
    Cprom=(c[0]+c[1]+c[2]+c[3])/4;
    Wo=Math.sqrt((4*9.81*d)*1.65/(3*Cprom));
  }
  r.Re=Re; r.Cd=Cprom; r.Wo=Wo;
  r.u=Wo-0.152*Wo;                       // velocidad corregida
  r.A=b*h; r.V=Q/r.A;
  r.Lcalc=(h*r.V)/r.u;
  r.L=Math.max(4,Math.ceil(r.Lcalc));

  /* vertedero de pared gruesa */
  const mo=parseDecimalFlex(S.mo)||1.05;
  r.mo=mo;
  r.hv=Math.round(Math.pow(Q/((b*mo)*4.4427188),1/1.5)*10)/10;
  r.rev=(h<=1)?0.2:0.3;
  r.hvr=r.hv+r.rev;
  r.hf=h+r.hvr;

  /* espesor de muros y radier */
  r.e=(r.hf<=0.5)?0.10:(r.hf<=1.5)?0.13:(r.hf<=2)?0.17:0.21;

  /* armadura */
  const dm=Number(S.d);
  r.suelo=familia(dm);
  const brk=[0.5,1,1.5,2,2.5].find(x=>r.hf<=x);
  r.brk=brk;
  if(brk===undefined){ r.msg.push(['b','Altura final '+fmt(r.hf,2)+' m fuera de tabla (máx. 2,5 m). Reduzca profundidad.']); }
  else r.arm=ARM[r.suelo][brk][Number(S.zona)-1];

  /* cubicación */
  r.qHorm=(r.e*r.hf*r.L*2 + r.e*b*r.L)*1.2;
  r.qMold=((r.hf*2)+(r.hf+r.e)*2)*r.L*1.2;
  r.qMalla=((r.hf+r.e/2)*2+(b+r.e))*r.L*1.3;

  /* precios */
  const bt=baseTabla();
  r.bt=bt;
  if(bt){
    r.pHorm=precioAp('horm'); r.pMold=precioAp('mold'); r.pMalla=precioArm(r.arm);
    r.tHorm=r.qHorm*r.pHorm; r.tMold=r.qMold*r.pMold; r.tMalla=r.qMalla*r.pMalla;
    r.CD=(r.tHorm||0)+(r.tMold||0)+(r.tMalla||0);
  }
  if(r.arm==='C-158') r.msg.push(['w','C-158 no tiene precio en la tabla DT-18; se interpola entre C-139 y C-221.']);
  if(r.hv===0) r.msg.push(['w','hv redondeado a 0,0 m (caudal bajo); rige sólo la revancha de '+fmt(r.rev,1)+' m.']);
  r.ok=true;
  return r;
}

function ip(key,ph,cls){

         'placeholder="'+(ph||'')+'" value="'+String(v).replace(/"/g,'&quot;')+'" oninput="onIn(this)">';
}
function onIn(el){
  const k=el.dataset.key; RAW[k]=el.value; S[k]=el.value; render();
}
function set(k,v){ S[k]=v; delete RAW[k]; render(); }
function ro(v){ return '<input class="result" readonly value="'+v+'">'; }

/* ============ render ============ */
function render(){
  const ae=document.activeElement;
  const fk=ae&&ae.dataset?ae.dataset.key:null;
  const ss=fk?ae.selectionStart:null, se=fk?ae.selectionEnd:null;
  const r=calcular();

    [['diseno','Diseño'],['presupuesto','Presupuesto'],['precios','Precios DT-18'],['informe','Informe']]
    .map(t=>'<div class="tab'+(TAB===t[0]?' on':'')+'" onclick="TAB=\''+t[0]+'\';render()">'+t[1]+'</div>').join('');

  app.innerHTML = TAB==='diseno'?vDiseno(r) : TAB==='presupuesto'?vPresu(r) : TAB==='precios'?vPrecios(r) : vInfTab(r);

  if(fk){ const n=app.querySelector('[data-key="'+fk+'"]');
    if(n){ n.focus(); try{n.setSelectionRange(ss,se);}catch(e){} } }
}

    '<div class="row"><label>Sección de escurrimiento A</label>'+ro(fmt(r.A,3))+'<span class="u">m²</span></div>'+
    '<div class="row"><label>Velocidad horizontal V</label>'+ro(fmt(r.V,4))+'<span class="u">m/s</span></div>'+
    '</div></div>'+
    '<div class="hint">Iteración Newton–Allen–Stokes; Cd = promedio de Putnam, Schiller, Olson y Stokes</div></div>';

  H+='<div class="card"><h3>Geometría del desarenador</h3><div class="g3"><div>'+
    '<div class="row"><label>Longitud calculada L = h·V/u</label>'+ro(fmt(r.Lcalc,2))+'<span class="u">m</span></div>'+
    '<div class="row"><label>Longitud adoptada</label>'+ro(fmt(r.L,0))+'<span class="u">m</span></div>'+
    '</div><div>'+
    '<div class="row"><label>Altura sobre vertedero hv</label>'+ro(fmt(r.hv,2))+'<span class="u">m</span></div>'+

    '</div><div>'+

    '</div></div>'+

    '</div></div>'+

  H+='<div class="card"><h3>Cubicación</h3><table><thead><tr><th>Partida</th><th style="text-align:right">Cantidad</th><th>Un.</th><th>Fórmula</th></tr></thead><tbody>'+
    '<tr><td>Hormigón G-20 (muros + radier)</td><td class="n">'+fmt(r.qHorm,2)+'</td><td>m³</td><td class="hint">(e·hf·L·2 + e·b·L) × 1,20</td></tr>'+

function esquema(r){
  const b=r.b,hf=r.hf,h=r.h,e=r.e,L=r.L;
  const wt=b+2*e, ht=hf+e;
  const mL=62,mR=66,mT=24,mB=38;
  let sc=Math.min(160/ht, 410/wt);
  const W=Math.round(mL+wt*sc+mR), Hh=Math.round(mT+ht*sc+mB);
  const x0=mL,y0=mT, px=v=>x0+v*sc, py=v=>y0+v*sc;
  let s='<svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;max-width:'+(W*1.15)+'px;margin-top:8px">';
  s+='<path class="fillC" d="M'+px(0)+' '+py(0)+' h'+(e*sc)+' v'+(hf*sc)+' h'+(b*sc)+' v'+(-hf*sc)+' h'+(e*sc)+
     ' v'+((hf+e)*sc)+' h'+(-wt*sc)+' Z"/>';
  s+='<rect class="fillW" x="'+px(e)+'" y="'+py(hf-h)+'" width="'+(b*sc)+'" height="'+(h*sc)+'"/>';
  s+='<line class="cot" x1="'+px(e)+'" y1="'+py(hf-h)+'" x2="'+px(e+b)+'" y2="'+py(hf-h)+'"/>';
  s+='<text x="'+px(e+b/2)+'" y="'+(py(hf-h)-3)+'" text-anchor="middle">N.A.  h = '+fmt(h,2)+' m</text>';
  const yb=py(hf+e)+13;
  s+='<line class="cot" x1="'+px(e)+'" y1="'+yb+'" x2="'+px(e+b)+'" y2="'+yb+'"/>';
  s+='<text x="'+px(e+b/2)+'" y="'+(yb+10)+'" text-anchor="middle">b = '+fmt(b,2)+' m</text>';
  const xl=px(0)-11;
  s+='<line class="cot" x1="'+xl+'" y1="'+py(0)+'" x2="'+xl+'" y2="'+py(hf+e)+'"/>';
  s+='<text x="'+(xl-3)+'" y="'+py((hf+e)/2)+'" text-anchor="end">hf+e</text>';
  s+='<text x="'+(xl-3)+'" y="'+(py((hf+e)/2)+9)+'" text-anchor="end">'+fmt(hf+e,2)+' m</text>';
  const xr=px(wt)+11;
  s+='<line class="cot" x1="'+xr+'" y1="'+py(hf-h)+'" x2="'+xr+'" y2="'+py(0)+'"/>';
  s+='<text x="'+(xr+3)+'" y="'+py((hf-h)/2+0.02)+'">hv+rev</text>';
  s+='<text x="'+(xr+3)+'" y="'+(py((hf-h)/2)+9)+'">'+fmt(r.hvr,2)+' m</text>';
  s+='<text x="'+px(wt/2)+'" y="'+(mT-7)+'" text-anchor="middle">Seccion transversal   e = '+fmt(e,2)+' m   L = '+fmt(L,0)+' m</text>';
  s+='</svg>';
  return s;
}

function fila(n,u,q,p,t){

/* ============ precios DT-18 ============ */
function vPrecios(r){
  const ALT=[1000,2000,3000,4000], ACC=[['P','Plano'],['L','Ladera media'],['D','Difícil acceso']];
  let H='<div class="card"><h3>Parámetros de precios</h3><div class="g3"><div>'+
    '<div class="row"><label>Altura de emplazamiento</label><select onchange="set(\'altura\',this.value)">'+
      ALT.map(a=>'<option value="'+a+'"'+(Number(S.altura)===a?' selected':'')+'>'+fmt(a,0)+' msnm</option>').join('')+
      '</select><span class="u"></span></div>'+
    '<div class="row"><label>UF base de la tabla</label>'+ip('ufBase','24.063,50','w140')+'<span class="u">$</span></div>'+
    '</div><div>'+
    '<div class="row"><label>Tipo de acceso</label><select onchange="set(\'acceso\',this.value)">'+
      ACC.map(a=>'<option value="'+a[0]+'"'+(S.acceso===a[0]?' selected':'')+'>'+a[1]+'</option>').join('')+
      '</select><span class="u"></span></div>'+
    '<div class="row"><label>UF del proyecto</label>'+ip('uf','40.873,77','w140')+'<span class="u">$</span></div>'+
    '</div><div>'+
    '<div class="row"><label>Distancia de transporte</label><select onchange="set(\'km\',this.value)">'+
      Array.from({length:30},(_,i)=>(i+1)*10).map(k=>'<option value="'+k+'"'+(Number(S.km)===k?' selected':'')+'>'+k+' km</option>').join('')+
      '</select><span class="u"></span></div>'+
    '<div class="row"><label>Factor de actualización UF</label>'+ro(fmt(factorUF(),4))+'<span class="u">—</span></div>'+
    '</div></div>'+
    '<div class="hint">UF al 31-08-2026 = $ 40.873,77 · verifique la UF vigente y la UF base de la edición DT-18 utilizada</div></div>';

  const bt=baseTabla();
  if(!bt) return H;
  const arm=r.ok?(r.arm||''):'';
  const armN=arm.replace('Doble malla ','');
  const rowP=(k,nom,un)=>{
    const mod=(S.pb&&S.pb[k]!==undefined&&S.pb[k]!==''&&S.pb[k]!==null);
    const sel=(k===armN)?' style="background:var(--ice);font-weight:700"':'';
    return '<tr'+sel+'><td>'+nom+(k===armN?' ◄ adoptada':'')+'</td><td>'+un+'</td>'+
      '<td class="n">'+money(bt[k])+'</td>'+
      '<td class="n" style="padding:2px 8px"><input type="text" inputmode="decimal" data-key="pb:'+k+'" class="w140" '+
        'placeholder="'+fmt(bt[k],0)+'" value="'+(mod?String(S.pb[k]):'')+'" oninput="onPb(this)"></td>'+
      '<td class="n">'+money(precioAp(k))+'</td></tr>';
  };
  H+='<div class="card"><h3>Precios unitarios DT-18</h3>'+
    '<table><thead><tr><th>Ítem</th><th>Un.</th><th style="text-align:right">Tabla DT-18</th>'+
    '<th style="text-align:right">Editar precio base</th><th style="text-align:right">Aplicado (× UF)</th></tr></thead><tbody>'+
    '<tr class="sec"><td colspan="5">Hormigón y moldaje</td></tr>'+
    rowP('horm','Hormigón G-20','m³')+
    rowP('mold','Moldaje (1 uso)','m²')+
    '<tr class="sec"><td colspan="5">Malla ACMA</td></tr>'+
    MALLAS.map(m=>rowP(m,'Malla '+m,'m²')).join('')+
    '</tbody></table>'+
    '<div class="row" style="margin-top:8px"><label class="hint">Deje el campo vacío para usar el precio de la tabla DT-18. La malla doble se cobra al doble del precio unitario.</label>'+
    '<button class="btn" onclick="resetPb()">Restablecer precios</button></div></div>';
  return H;
}
function onPb(el){
  const k=el.dataset.key.slice(3);
  if(!S.pb) S.pb={};
  if(el.value==='') delete S.pb[k]; else S.pb[k]=el.value;
  RAW[el.dataset.key]=el.value;
  render();
}
function resetPb(){ S.pb={}; Object.keys(RAW).forEach(k=>{if(k.indexOf('pb:')===0)delete RAW[k];}); render(); }

function ifila(n,u,q,p,t){

/* ============ persistencia ============ */
function guardar(){
  const blob=new Blob([JSON.stringify({formato:'desarenador-cnr',version:1,datos:S},null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Desarenador_'+((S.nombre||'proyecto').replace(/[^\w\-]+/g,'_'))+'.json';
  a.click();
}
function cargar(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{ try{
      const j=JSON.parse(e.target.result);
      const d=j.datos||j;
      Object.keys(DEF).forEach(k=>{ if(d[k]!==undefined) S[k]=d[k]; });
      Object.keys(RAW).forEach(k=>delete RAW[k]);
      render();
    }catch(err){ alert('Archivo no válido'); } };
  rd.readAsText(f); ev.target.value='';
}

render();
