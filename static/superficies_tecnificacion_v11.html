<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cálculo de Superficies de Tecnificación</title>
<style>
:root{
  --navy:#0b2545; --blue:#1e5ba6; --ice:#eef4fb; --frost:#f7fafc;
  --border:#d7e2ee; --ok:#1b7a3d; --warn:#b45309; --err:#b3261e;
}
@media(prefers-color-scheme:dark){
  :root{ --navy:#0b2545; --blue:#4d8fd6; --ice:#132338; --frost:#0e1a2b; --border:#274156; }
  body{background:#0a1420;color:#dbe6f2}
  .card{background:#0f2035}
  input,select{background:#0c1c2e;color:#dbe6f2;border-color:var(--border)}
  th{background:#152a42}
  td,th{border-color:var(--border)}
}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito",system-ui,sans-serif;background:var(--frost);color:#16243a}
header{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px;gap:14px}
header .app-title{font-weight:800;font-size:15px}
header .codigo{margin-left:auto;display:flex;align-items:center;gap:6px}
header .codigo input{width:200px}
.bn-eq{display:flex;gap:6px}
.bn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;font-weight:700}
.bn:hover{background:rgba(255,255,255,.24)}
.tabs{display:flex;gap:6px;padding:10px 14px;background:var(--ice);flex-wrap:wrap;border-bottom:1px solid var(--border);justify-content:center}
.tab{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;border:1px solid var(--border);color:#3a4d63}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
main{max-width:1020px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;align-items:center;gap:10px;padding:4px 0;flex-wrap:wrap}
.row label{flex:0 0 260px;font-size:13.5px}
.hint{font-size:11px;color:#6b7d90;margin:-2px 0 6px 0}
input[type=text]{font-family:"DM Mono",monospace;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;width:110px}
input.num{text-align:right}
td input.num{text-align:right}
.instr{margin-bottom:10px}
.instr-head{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--navy);user-select:none}
.instr-body{margin:8px 0 0;padding-left:18px;font-size:12px;color:#3a4d63;line-height:1.5}
.instr-body li{margin-bottom:4px}
select{font-family:"Nunito",sans-serif;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;width:170px}
input:disabled{background:var(--ice);font-weight:700;color:#16243a}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--border);padding:5px 6px;text-align:center;white-space:nowrap}
th{background:var(--ice);font-weight:700}
td input[type=text]{width:70px;padding:3px 5px;font-size:12.5px}
td select{width:150px;font-size:12px;padding:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 16px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px 14px}
.stat-label{font-size:11px;color:#6b7d90;text-transform:uppercase;line-height:1.3}
.stat-value{font-size:16px;font-weight:700;font-family:"DM Mono",monospace;color:#16243a;margin-top:2px}
.stat-value input.num{font-size:16px;font-weight:700;width:100%;max-width:170px}
th.tt-th{position:relative;cursor:help}
th.tt-th .tt-bubble{display:none;position:absolute;z-index:100;right:0;top:100%;background:var(--navy);color:#fff;padding:8px 10px;border-radius:8px;font-size:11.5px;font-weight:400;text-transform:none;white-space:normal;width:230px;box-shadow:0 6px 16px rgba(0,0,0,.25);text-align:left;line-height:1.4}
th.tt-th:hover .tt-bubble, th.tt-th.tt-open .tt-bubble{display:block}
.tablewrap{overflow-y:visible}
.result{background:var(--ice);border:1px solid var(--blue);border-radius:8px;padding:12px 16px;margin-top:8px}
.result .big{font-size:22px;font-weight:800;color:var(--navy);font-family:"DM Mono",monospace}
.badge-ok{color:var(--ok);font-weight:700;font-size:12px}
.badge-warn{color:var(--warn);font-weight:700;font-size:12px}
.badge-err{color:var(--err);font-weight:700;font-size:12px}
.msg{font-size:12px;font-weight:700;padding:4px 0}
.msg.err{color:var(--err)}
.msg.warn{color:var(--warn)}
.linkbtn{font-size:12px;color:var(--blue);cursor:pointer;font-weight:700}
.smallbtn{background:var(--ice);border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;font-weight:700;color:var(--navy)}
.chk-table td input{width:90px}
.chk-table td.delta{font-family:"DM Mono",monospace;font-weight:700}
#fileInput{display:none}
@media print{
  header,.tabs,.no-print,.instr{display:none!important}
  section{display:block!important}
  main{max-width:100%;padding:0 8mm}
  body{font-size:11px}
  .card{border:none;padding:6px 10px;page-break-inside:avoid}
  .card h3{font-size:12px}
  table{font-size:10.5px}
  @page{size:letter;margin:14mm}
}
</style>
</head>
<body>
<header>
  <span class="app-title">Cálculo de Superficies de Tecnificación</span>
  <div class="codigo">

    <input type="text" id="inpCodigo" style="width:180px">
  </div>
  <div class="bn-eq no-print">
    <button class="bn" onclick="exportJSON()">Exportar JSON</button>
    <button class="bn" onclick="document.getElementById('fileInput').click()">Importar JSON</button>
    <button class="bn" onclick="window.print()">Imprimir</button>
  </div>
  <input type="file" id="fileInput" accept=".json">
</header>

<div class="tabs no-print">
  <div class="tab" data-tab="0">1 · Predio</div>

</div>

/* ===================== HELPERS NUMÉRICOS ===================== */
function parseDecimalFlex(str){
  if(str===null||str===undefined) return 0;
  str = String(str).trim();
  if(str==='') return 0;
  const hasDot = str.includes('.'), hasComma = str.includes(',');
  if(hasDot && hasComma){
    const lastDot = str.lastIndexOf('.'), lastComma = str.lastIndexOf(',');
    if(lastComma>lastDot){ str = str.replace(/\./g,'').replace(',','.'); }
    else { str = str.replace(/,/g,''); }
  } else if(hasComma){
    str = str.replace(',','.');
  }
  const n = parseFloat(str);
  return isNaN(n) ? 0 : n;
}
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function round3(n){ return Math.round((n+Number.EPSILON)*1000)/1000; }
function avg(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function fmt(n, dec){
  dec = dec===undefined?3:dec;
  if(n===null||n===undefined||isNaN(n)) n=0;
  return n.toLocaleString('es-CL', {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
// Para campos editables: no muestra "0" precargado, solo lo que el usuario ingresó.
function fmtEdit(n, dec){
  dec = dec===undefined?3:dec;
  if(n===null||n===undefined||isNaN(n)||n===0) return '';
  return n.toLocaleString('es-CL', {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o===undefined||o===null)?o:o[k], obj); }
function setPath(obj, path, val){
  const parts = path.split('.'); let o = obj;
  for(let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}

/* ===================== CÁLCULOS ===================== */
function getEf(metodoId, cal){
  const m = METODOS.find(x=>x.id===metodoId);
  if(!m) return 0;
  if(cal && m.efCal!=null) return m.efCal/100;
  return m.ef/100;
}
function calcPredio(){
  const totalPorClase=[0,0,0,0,0,0,0,0];
  S.roles.forEach(r=> r.c.forEach((v,i)=> totalPorClase[i]+=(v||0)));
  S.reclasif.forEach((v,i)=> totalPorClase[i]+=(v||0));
  const totalGeneral = round3(totalPorClase.reduce((a,b)=>a+b,0));
  const sumIaIV = round3(totalPorClase[0]+totalPorClase[1]+totalPorClase[2]+totalPorClase[3]);
  const asim = S.asimilacion||0, titulo = S.tituloDominio||0;
  const ratio = totalGeneral>0 ? sumIaIV/totalGeneral : 0;
  let regableMax = sumIaIV + asim + round3(ratio*(titulo-totalGeneral));
  if(regableMax>titulo) regableMax = titulo;
  regableMax = round3(Math.max(regableMax,0));
  return {totalPorClase, totalGeneral, sumIaIV, regableMax};
}
function calcDemanda(){
  const d = S.demanda;
  if(d.fuente==='manual'){
    const etoDia = d.etoManualDia||0;
    return {demandaLsHa:round3(etoDia*10000/86400), etoDia:round3(etoDia), etpTemporada:round3(d.etpManualTemporada||0), top3Label:d.mesesManual||''};
  }
  if(d.fuente==='estacion'){
    const vals = ETO_ESTACIONES[d.estacion];
    if(!vals) return {demandaLsHa:0, etoDia:0, etpTemporada:0, top3Label:'—'};
    const ordenado = vals.map((v,i)=>[v,i]).sort((a,b)=> b[0]-a[0]);
    const top3 = ordenado.slice(0,3);
    const top3Dia = top3.map(([v,i])=> v/DIAS_CAL[i]);
    const top3LsHa = top3.map(([v,i])=> v*10000/(86400*DIAS_CAL[i]));
    const etoDia = round3(avg(top3Dia));
    const demandaLsHa = round3(avg(top3LsHa));
    const top3Label = top3.map(([v,i])=> MESC_CAL[i]).join(' / ');
    const mmTemporada = TEMPORADA_CAL_IDX.reduce((s,i)=> s+vals[i], 0);
    const etpTemporada = round3(mmTemporada*10);
    return {demandaLsHa, etoDia, etpTemporada, top3Label};
  }
  const pct = ZONAS[d.zona];
  if(!pct) return {demandaLsHa:0, etoDia:0, etpTemporada:0, top3Label:'—'};
  const iso = d.isolinea||0;
  if(iso<=0) return {demandaLsHa:0, etoDia:0, etpTemporada:0, top3Label:'—'};
  const mesesMM = pct.map(p=> iso*p/100);
  const ordenado = mesesMM.map((v,i)=>[v,i]).sort((a,b)=> b[0]-a[0]);
  const top3 = ordenado.slice(0,3);
  const top3Dia = top3.map(([v,i])=> v/DIAS[i]);
  const top3LsHa = top3.map(([v,i])=> v*10000/(86400*DIAS[i]));
  const etoDia = round3(avg(top3Dia));
  const demandaLsHa = round3(avg(top3LsHa));
  const top3Label = top3.map(([v,i])=> MESES[i]).join(' / ');
  const sumaPctTemp = TEMPORADA_IDX.reduce((s,i)=> s+pct[i], 0);
  const mmTemporada = iso*sumaPctTemp/100;
  const etpTemporada = round3(mmTemporada*10); // m3/ha temporada
  return {demandaLsHa, etoDia, etpTemporada, top3Label};
}
function calcSituacion(sit, demandaLsHa, etpTemporadaHa){
  let totalHa=0, qCanal=0, qPozo=0, qEmbalse=0;
  const detalle = sit.metodos.map(m=>{
    if(!m.metodo) return null;
    const ef = getEf(m.metodo, m.cal);
    const ha = (m.haCanal||0)+(m.haPozo||0)+(m.haEmbalse||0);
    totalHa += ha;
    const qc = ef>0 ? (m.haCanal||0)*(demandaLsHa/ef) : 0;
    const qp = ef>0 ? (m.haPozo||0)*(demandaLsHa/ef) : 0;
    const qe = ef>0 ? (m.haEmbalse||0)*(etpTemporadaHa/ef) : 0;
    qCanal += qc; qPozo += qp; qEmbalse += qe;
    return {metodo:m.metodo, cal:m.cal, ef, ha, qc:round3(qc), qp:round3(qp), qe:round3(qe)};
  }).filter(Boolean);
  return {totalHa:round3(totalHa), qCanal:round3(qCanal), qPozo:round3(qPozo), qEmbalse:round3(qEmbalse), detalle};
}
function calcEficienciaPonderadaAT11(detalleActual){
  const activos = detalleActual.filter(d=> d.ha>0);
  const Stotal = activos.reduce((s,d)=> s+d.ha, 0);
  if(Stotal<=0) return null;
  const denom = activos.reduce((s,d)=> s + (d.ha/Stotal)*(1/d.ef), 0);
  if(denom<=0) return null;
  return round3(1/denom);
}
function calcDispEfectiva(sit){
  return {
    canal: sit.eventual ? round3((sit.disp.canal||0)*0.5) : (sit.disp.canal||0),
    pozo: sit.eventual ? round3((sit.disp.pozo||0)*0.5) : (sit.disp.pozo||0),
    embalse: sit.disp.embalse||0
  };
}
function calcTodo(){
  const dem = calcDemanda();
  const predio = calcPredio();
  const actualCalc = calcSituacion(S.actual, dem.demandaLsHa, dem.etpTemporada);
  const futuroCalc = calcSituacion(S.futuro, dem.demandaLsHa, dem.etpTemporada);
  const dispActualEf = calcDispEfectiva(S.actual);
  const dispFuturoEf = calcDispEfectiva(S.futuro);
  const SRA = actualCalc.totalHa, SRF = futuroCalc.totalHa;
  const generaExcedente = (predio.regableMax<=SRF) || (SRF>=SRA);
  let qLibCanal=0, qLibPozo=0, qLibEmbalse=0;
  if(generaExcedente){
    qLibCanal = Math.max(actualCalc.qCanal-futuroCalc.qCanal,0);
    qLibPozo = Math.max(actualCalc.qPozo-futuroCalc.qPozo,0);
    qLibEmbalse = Math.max(actualCalc.qEmbalse-futuroCalc.qEmbalse,0);
  }
  const efSugerida = calcEficienciaPonderadaAT11(actualCalc.detalle);
  const efUsadaFrac = (S.resultado.efSistemaActualPct!=null && S.resultado.efSistemaActualPct>0)
    ? S.resultado.efSistemaActualPct/100 : efSugerida;
  let SRQeCanal=0, SRQePozo=0, SRQeEmbalse=0;
  if(efUsadaFrac && efUsadaFrac>0 && !S.resultado.nuevosRecursos){
    const demExcCP = dem.demandaLsHa/efUsadaFrac;
    const demExcEmb = dem.etpTemporada/efUsadaFrac;
    SRQeCanal = demExcCP>0 ? round3(qLibCanal/demExcCP) : 0;
    SRQePozo = demExcCP>0 ? round3(qLibPozo/demExcCP) : 0;
    SRQeEmbalse = demExcEmb>0 ? round3(qLibEmbalse/demExcEmb) : 0;
  }
  const SRQe = round3(SRQeCanal+SRQePozo+SRQeEmbalse);
  const supProyecto = S.superficieProyecto||0;
  const SNR = round3(Math.min(SRF-SRA, supProyecto));
  const SENR = round3(Math.min(SRQe, supProyecto));
  let postulacion = round3(SNR+SENR);
  if(postulacion>supProyecto) postulacion = round3(supProyecto);
  let postulacionFinal = postulacion;
  if(S.resultado.ernc){
    postulacionFinal = round3(postulacion*(1+(S.resultado.pctP||0)/100));
  }
  const incrementoPotencialidad = round3(postulacionFinal*FACTOR_POTENCIALIDAD);

  // Superficie máxima regable sugerida con el agua disponible (ITT-02 punto 4.a/4.b), según eficiencia del primer método activo
  function sugerenciaMax(sit, dispEf, detalle){
    const primero = detalle.find(d=>d.ef>0);
    if(!primero) return null;
    const ef = primero.ef;
    return {
      canal: ef>0 && dem.demandaLsHa>0 ? round3(dispEf.canal/(dem.demandaLsHa/ef)) : 0,
      pozo: ef>0 && dem.demandaLsHa>0 ? round3(dispEf.pozo/(dem.demandaLsHa/ef)) : 0,
      embalse: ef>0 && dem.etpTemporada>0 ? round3(dispEf.embalse/(dem.etpTemporada/ef)) : 0,
      efUsada: ef
    };
  }
  const sugerenciaActual = sugerenciaMax(S.actual, dispActualEf, actualCalc.detalle);
  const sugerenciaFuturo = sugerenciaMax(S.futuro, dispFuturoEf, futuroCalc.detalle);

  // Validaciones
  const msgs = [];
  if(supProyecto>predio.regableMax+0.01) msgs.push({t:'err', m:'La superficie del proyecto no puede ser mayor a la superficie regable máxima.'});
  if(SRA>predio.regableMax-S.asimilacion+0.01) msgs.push({t:'warn', m:'La SRA no puede ser mayor a la superficie regable del predio menos la asimilación.'});
  if(actualCalc.qCanal-0.03>dispActualEf.canal) msgs.push({t:'err', m:'Agua insuficiente (canal, situación actual)'+(S.actual.eventual?' — considerando factor 0,5 por derecho eventual':'')+'.'});
  if(actualCalc.qPozo-0.03>dispActualEf.pozo) msgs.push({t:'err', m:'Agua insuficiente (pozo, situación actual)'+(S.actual.eventual?' — considerando factor 0,5 por derecho eventual':'')+'.'});
  if(actualCalc.qEmbalse-300>dispActualEf.embalse) msgs.push({t:'err', m:'Agua insuficiente (embalse, situación actual).'});
  if(futuroCalc.qCanal-0.03>dispFuturoEf.canal) msgs.push({t:'err', m:'Agua insuficiente (canal, situación futura)'+(S.futuro.eventual?' — considerando factor 0,5 por derecho eventual':'')+'.'});
  if(futuroCalc.qPozo-0.03>dispFuturoEf.pozo) msgs.push({t:'err', m:'Agua insuficiente (pozo, situación futura)'+(S.futuro.eventual?' — considerando factor 0,5 por derecho eventual':'')+'.'});
  if(futuroCalc.qEmbalse-300>dispFuturoEf.embalse) msgs.push({t:'err', m:'Agua insuficiente (embalse, situación futura).'});
  if(SRF<SRA-0.01) msgs.push({t:'warn', m:'La superficie de riego futura no puede ser menor que la actual.'});
  if(supProyecto>0 && postulacionFinal>supProyecto+0.01 && !S.resultado.ernc) msgs.push({t:'warn', m:'La superficie de postulación no puede ser mayor a la superficie física del proyecto.'});
  if(S.resultado.nuevosRecursos && SRQe===0 && (qLibCanal>0||qLibPozo>0||qLibEmbalse>0)) msgs.push({t:'warn', m:'Se forzó SRQe=0 por incorporar nuevos recursos hídricos (ITT-02 punto 4.5.c) — el agua liberada no genera excedentario.'});

  return {dem, predio, actualCalc, futuroCalc, dispActualEf, dispFuturoEf, sugerenciaActual, sugerenciaFuturo,
          SRA, SRF, qLibCanal:round3(qLibCanal), qLibPozo:round3(qLibPozo), qLibEmbalse:round3(qLibEmbalse),
          efSugerida, efUsadaFrac, SRQeCanal, SRQePozo, SRQeEmbalse, SRQe, SNR, SENR, postulacion, postulacionFinal, incrementoPotencialidad, msgs};
}

/* ===================== RENDER (con preservación de foco) ===================== */
function render(){
  const active = document.activeElement;
  let savedKey=null, savedStart=null, savedEnd=null;
  if(active && active.dataset && active.dataset.key){
    savedKey = active.dataset.key; savedStart = active.selectionStart; savedEnd = active.selectionEnd;
  }
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', Number(t.dataset.tab)===TAB));
  const main = document.getElementById('main');
  const NOMBRES_TAB = ['Predio','Demanda','Situación Actual','Situación Futura','Resultado','Informe'];
  main.innerHTML = [renderPredio, renderDemanda, ()=>renderSituacion('actual','Situación Actual'), ()=>renderSituacion('futuro','Situación Futura'), renderResultado, renderInforme][TAB]() + renderNav();
  bindGenericInputs();
  document.getElementById('inpCodigo').value = S.codigo;
  document.getElementById('inpCodigo').oninput = e=>{ S.codigo = e.target.value; };
  if(savedKey){
    const el = main.querySelector(`[data-key="${savedKey}"]`);
    if(el){ el.focus(); try{ el.setSelectionRange(savedStart, savedEnd); }catch(e){} }
  }
}
function bindGenericInputs(){
  document.querySelectorAll('input[data-key][type=text].num').forEach(inp=>{
    const key = inp.dataset.key;
    const dec = inp.dataset.dec!==undefined ? Number(inp.dataset.dec) : 3;
    inp.value = (RAW[key]!==undefined) ? RAW[key] : fmtEdit(getPath(S,key), dec);
    inp.oninput = e=>{
      RAW[key] = e.target.value;
      setPath(S, key, parseDecimalFlex(e.target.value));
      renderLight();
    };
    inp.onblur = ()=>{ delete RAW[key]; render(); };
  });
  document.querySelectorAll('input[data-key][type=text].txt').forEach(inp=>{
    const key = inp.dataset.key;
    inp.value = (RAW[key]!==undefined) ? RAW[key] : (getPath(S,key)||'');
    inp.oninput = e=>{
      RAW[key] = e.target.value;
      setPath(S, key, e.target.value);
    };
    inp.onblur = ()=>{ delete RAW[key]; render(); };
  });
  document.querySelectorAll('select[data-key]').forEach(sel=>{
    const key = sel.dataset.key;
    sel.value = getPath(S,key);
    sel.onchange = e=>{
      const v = e.target.value==='true'?true:e.target.value==='false'?false:e.target.value;
      setPath(S, key, v);
      if(key.endsWith('.metodo')) setPath(S, key.replace(/\.metodo$/,'.cal'), false);
      render();
    };
  });
}
function renderLight(){ render(); }

    '<b>ETo (3 meses máx.)</b> → sirve para la "Demanda por ha" en <u>l/s/ha</u>, usada en el balance con fuentes de <u>caudal continuo</u> (canal, pozo).',
    '<b>ETp temporada</b> → es la suma de ETo de TODA la temporada de riego (septiembre a abril), en <u>m³/ha</u>. Se usa solo para el balance con fuentes de <u>volumen acumulado</u> (embalses).',
    'Son dos datos distintos porque un canal/pozo entrega agua de forma continua (se compara con la demanda del peor momento del año), mientras un embalse almacena un volumen para toda la temporada (se compara con el total consumido en 8 meses).',
    '<b>Modo Manual</b>: úselo si cuenta con ETo real de otra fuente (p. ej. Explorador Solar / SNR de Demandas de Agua).',
    '<b>Superficie del proyecto</b>: superficie física a tecnificar; no puede superar la superficie regable máxima (pestaña Predio).'

  <div class="card">
    <h3>Origen del ETo</h3>
    <div class="row"><label>Fuente</label>

        <option value="manual" ${d.fuente==='manual'?'selected':''}>Manual</option>
      </select>
    </div>
    ${d.fuente==='tabla' ? `
    <div class="row"><label>Zona ETp</label>
      <select data-key="demanda.zona"><option value="">— Seleccionar —</option>${Object.keys(ZONAS).map(z=>`<option value="${z}" ${d.zona===z?'selected':''}>Zona ${z}</option>`).join('')}</select>
    </div>
    <div class="row"><label>Isolínea ETp</label><input type="text" class="num" data-key="demanda.isolinea"><span>mm/año</span></div>
    ` : ''}
    ${d.fuente==='estacion' ? `

      <input type="text" class="txt" list="listaEstaciones" data-key="demanda.estacion" placeholder="Escriba para buscar..." style="width:260px;text-align:left">
      <datalist id="listaEstaciones">${Object.keys(ETO_ESTACIONES).map(e=>`<option value="${e}">`).join('')}</datalist>
      ${d.estacion && !ETO_ESTACIONES[d.estacion] ? `<span class="badge-err">Estación no encontrada en la lista</span>` : (d.estacion? `<span class="badge-ok">✓ ${561} estaciones disponibles</span>` : '')}
    </div>

    ${d.fuente==='manual' ? `
    <div class="row"><label title="ETo diario promedio de los 3 meses de mayor demanda — usado para el balance con canal/pozo">ETo prom. 3 meses máx.</label><input type="text" class="num" data-key="demanda.etoManualDia"><span>mm/día</span></div>
    <div class="row"><label title="Suma de ETo de toda la temporada de riego (sept-abril) — usado para el balance con embalses">ETp temporada (Sep-Abr)</label><input type="text" class="num" data-key="demanda.etpManualTemporada"><span>m³/ha</span></div>
    <div class="row"><label>Meses de máxima demanda (referencial)</label><input type="text" class="txt" data-key="demanda.mesesManual" placeholder="Diciembre / Enero / Febrero" style="width:180px;text-align:left"></div>
    ` : ''}
  </div>
  <div class="card grid2">
    <div class="row"><label title="Los 3 meses del año con mayor demanda hídrica según la zona/isolínea seleccionada">Meses de máxima demanda</label><input type="text" value="${dem.top3Label}" disabled style="width:150px"></div>
    <div class="row"><label title="Promedio del ETo diario de los 3 meses de mayor demanda. Se usa para calcular la demanda en l/s/ha (fuentes de caudal continuo: canal/pozo)">ETo (3 meses máx.)</label><input type="text" value="${fmt(dem.etoDia)}" disabled><span>mm/día</span></div>
    <div class="row"><label>Demanda por ha <span style="font-weight:400;color:#6b7d90">(canal/pozo)</span></label><input type="text" value="${fmt(dem.demandaLsHa)}" disabled><span>l/s/ha</span></div>
    <div class="row"><label title="Suma de ETo entre septiembre y abril (toda la temporada de riego). Se usa para el balance con fuentes de volumen acumulado (embalses) — NO es lo mismo que el ETo de los 3 meses máximos">ETp temporada <span style="font-weight:400;color:#6b7d90">(embalse)</span></label><input type="text" value="${fmt(dem.etpTemporada)}" disabled><span>m³/ha</span></div>
  </div>
  <div class="card">
    <div class="row"><label>Superficie del proyecto</label><input type="text" class="num" data-key="superficieProyecto"><span>ha</span></div>

}

/* ===================== TAB 3/4: SITUACIÓN ACTUAL/FUTURA ===================== */
function renderSituacion(key, titulo){
  const sit = S[key];
  const dem = calcDemanda();
  const calc = calcSituacion(sit, dem.demandaLsHa, dem.etpTemporada);
  const todo = calcTodo();
  const dispEf = key==='actual' ? todo.dispActualEf : todo.dispFuturoEf;
  const sugerencia = key==='actual' ? todo.sugerenciaActual : todo.sugerenciaFuturo;
  const qLabel = key==='actual' ? 'QSRA' : 'QSRF';
  const metodoRows = sit.metodos.map((m,i)=>{
    const mDef = METODOS.find(x=>x.id===m.metodo);
    const admiteCal = mDef && mDef.efCal!=null;
    const calCell = admiteCal
      ? `<select data-key="${key}.metodos.${i}.cal"><option value="false" ${!m.cal?'selected':''}>No</option><option value="true" ${m.cal?'selected':''}>Sí</option></select>`
      : `<span style="color:#9aa8b8">No aplica</span>`;
    const ef = m.metodo ? getEf(m.metodo,m.cal) : 0;
    const qc = ef>0 ? round3((m.haCanal||0)*(dem.demandaLsHa/ef)) : 0;
    const qp = ef>0 ? round3((m.haPozo||0)*(dem.demandaLsHa/ef)) : 0;
    const qe = ef>0 ? round3((m.haEmbalse||0)*(dem.etpTemporada/ef)) : 0;
    return `
    <tr>
      <td><select data-key="${key}.metodos.${i}.metodo"><option value="">—</option>${METODOS.map(mm=>`<option value="${mm.id}" ${m.metodo===mm.id?'selected':''}>${mm.nombre}</option>`).join('')}</select></td>
      <td title="Solo aplica a métodos gravitacionales con aducción californiana (Tabla N°1, ITT-02)">${calCell}</td>
      <td>${m.metodo? (ef*100).toFixed(0)+'%' : '—'}</td>
      <td><input type="text" class="num" data-key="${key}.metodos.${i}.haCanal"></td>
      <td><input type="text" class="num" data-key="${key}.metodos.${i}.haPozo"></td>
      <td><input type="text" class="num" data-key="${key}.metodos.${i}.haEmbalse"></td>
      <td style="background:var(--ice);font-family:'DM Mono',monospace">${m.metodo? `${fmt(qc)} / ${fmt(qp)} / ${fmt(qe)}` : '—'}</td>
    </tr>`;
  }).join('');
  const msgAgua = [];
  if(calc.qCanal-0.03>dispEf.canal) msgAgua.push('Agua insuficiente (canal)'+(sit.eventual?' — ya considerando factor 0,5 por derecho eventual':'')+'.');
  if(calc.qPozo-0.03>dispEf.pozo) msgAgua.push('Agua insuficiente (pozo)'+(sit.eventual?' — ya considerando factor 0,5 por derecho eventual':'')+'.');
  if(calc.qEmbalse-300>dispEf.embalse) msgAgua.push('Agua insuficiente (embalse).');
  return `
  ${renderInstr('sit-'+key, [
    'Ingrese la disponibilidad de agua Q85% de la situación '+(key==='actual'?'actual':'futura')+' por fuente: canal, pozo o embalse.',
    'Si el derecho es <b>eventual</b> (ITT-01 punto 2), active el check — aplica el factor 0,5 automáticamente al canal/pozo declarado antes de comparar contra el consumo. Solo es válido en Zona Sur/Extremo Sur o con certificación de la organización de usuarios; verifique que su caso califica.',
    'Por cada método de riego, indique la superficie (ha) regada según la fuente de agua que utiliza. La columna "'+qLabel+' por fila" muestra el caudal canal/pozo/embalse que consume esa fila.',
    'La eficiencia se obtiene automáticamente de la Tabla N°1 (ITT-02) según el método y si tiene conducción californiana.',
    'Conducción californiana solo aplica a métodos gravitacionales (tendido, surcos, bordes, pretiles, tazas) — se oculta en métodos presurizados.',
    '"Superficie máxima sugerida" es orientativa: cuánta superficie regable da la disponibilidad ingresada, usando la eficiencia del primer método activo (ITT-02 punto 4.a/4.b). No reemplaza lo que usted ingresó abajo, solo ayuda a verificarlo.'
  ])}
  <div class="card">
    <h3>Disponibilidad Q85% — ${titulo}</h3>
    <div class="grid3">
      <div class="row"><label>Canal</label><input type="text" class="num" data-key="${key}.disp.canal"><span>l/s</span></div>
      <div class="row"><label>Pozo</label><input type="text" class="num" data-key="${key}.disp.pozo"><span>l/s</span></div>
      <div class="row"><label>Embalse</label><input type="text" class="num" data-key="${key}.disp.embalse"><span>m³/año</span></div>
    </div>
    <div class="row"><label title="ITT-01 punto 2: aplica factor 0,5 al canal/pozo declarado (Zona Sur/Extremo Sur o con certificación OUA)">¿Derecho eventual?</label>
      <select data-key="${key}.eventual"><option value="false" ${!sit.eventual?'selected':''}>No</option><option value="true" ${sit.eventual?'selected':''}>Sí (aplica factor 0,5)</option></select>
    </div>
    ${sit.eventual ? `<div class="hint">Disponibilidad efectiva usada en el balance: canal ${fmt(dispEf.canal)} l/s · pozo ${fmt(dispEf.pozo)} l/s</div>` : ''}
    ${sugerencia ? `<div class="hint">Superficie máxima sugerida con esta disponibilidad (ef. ${(sugerencia.efUsada*100).toFixed(0)}% del primer método activo): canal ${fmt(sugerencia.canal)} ha · pozo ${fmt(sugerencia.pozo)} ha · embalse ${fmt(sugerencia.embalse)} ha</div>` : ''}
  </div>
  <div class="card">
    <h3>Métodos de riego (hasta 4)</h3>
    <div class="tablewrap">
    <table>
      <tr><th>Método</th><th>Conducc. californiana</th><th>Eficiencia</th><th>Ha (canal)</th><th>Ha (pozo)</th><th>Ha (embalse)</th><th class="tt-th" onclick="this.classList.toggle('tt-open')">Q fila: canal/pozo/embalse<span class="tt-bubble">Caudal que consume esa fila: canal y pozo en l/s (continuo) · embalse en m³/año (volumen de temporada). No es una superficie, es el costo en agua de esa fila.</span></th></tr>
      ${metodoRows}
    </table>
    </div>
  </div>
  <div class="result">
    <div class="grid4">
      <div>
        <div style="font-size:11px;color:#6b7d90;text-transform:uppercase">Superficie total (${key==='actual'?'SRA':'SRF'})</div>
        <div class="big" style="font-size:19px">${fmt(calc.totalHa)} ha</div>
      </div>
      <div>
        <div style="font-size:11px;color:#6b7d90;text-transform:uppercase" title="${qLabel} — caudal continuo, comparable contra la disponibilidad">Canal (${qLabel})</div>
        <div class="big" style="font-size:19px">${fmt(calc.qCanal)} l/s</div>
      </div>
      <div>
        <div style="font-size:11px;color:#6b7d90;text-transform:uppercase" title="${qLabel} — caudal continuo, comparable contra la disponibilidad">Pozo (${qLabel})</div>
        <div class="big" style="font-size:19px">${fmt(calc.qPozo)} l/s</div>
      </div>
      <div>
        <div style="font-size:11px;color:#6b7d90;text-transform:uppercase" title="${qLabel} — volumen de la temporada, comparable contra la disponibilidad">Embalse (${qLabel})</div>
        <div class="big" style="font-size:19px">${fmt(calc.qEmbalse)} m³/año</div>
      </div>
    </div>
    ${msgAgua.map(m=>`<div class="msg err">${m}</div>`).join('')}
  </div>`;
}

/* ===================== TAB 5: RESULTADO ===================== */
function renderResultado(){
  const c = calcTodo();
  const chk = S.chequeo;
  function deltaRow(label, calculado, key, dec){
    dec = dec===undefined?2:dec;
    const declarado = chk[key];
    let deltaHtml = '<span style="color:#9aa8b8">— sin valor declarado</span>';
    if(declarado!==null && declarado!==undefined){
      const delta = round2(calculado-declarado);
      const ok = Math.abs(delta)<=0.02;
      deltaHtml = `<span class="${ok?'badge-ok':'badge-err'}">${ok?'✓ coincide':'⚠ difiere en '+fmt(Math.abs(delta),dec)+' ha'}</span>`;
    }
    return `<tr>
      <td style="text-align:left">${label}</td>
      <td>${fmt(calculado,dec)}</td>
      <td><input type="text" class="num" data-key="chequeo.${key}" placeholder="declarado"></td>
      <td class="delta">${deltaHtml}</td>
    </tr>`;
  }
  return `
  ${renderInstr('resultado', [
    'El agua liberada por la mejora de eficiencia (Actual→Futura) se calcula sola y define la superficie por caudal excedentario (SRQe, AT-11).',
    'La eficiencia ponderada AT-11 se sugiere automáticamente desde los métodos de Situación Actual; puede sobrescribirla si el proyecto declara otro valor.',
    'Superficie de postulación = SNR + SENR (ITT-02, punto 4.2).',
    'Si el proyecto incorpora <b>nuevos recursos hídricos</b> (pozo o impulsión nueva), el ITT-02 punto 4.5.c prohíbe que el cálculo genere caudal excedentario — active el check para forzar SRQe=0.',
    'Incremento de potencialidad de suelos = Superficie de postulación × factor del Cuadro N°1 letra b) del Reglamento vigente (hoy 1,00 para clases I-IV en todas las comunas — revisar si cambia con el nuevo Reglamento en elaboración).'
  ])}
  <div class="card grid3">
    <div><div class="stat-label" title="Canal y pozo en l/s (caudal continuo) · embalse en m³/año (volumen de temporada)">Q liberado (canal l/s - pozo l/s - embalse m³/año)</div><div class="stat-value" style="font-size:13px">${fmt(c.qLibCanal)} - ${fmt(c.qLibPozo)} - ${fmt(c.qLibEmbalse)}</div></div>
    <div><div class="stat-label">Eficiencia ponderada sugerida (AT-11)</div><div class="stat-value">${c.efSugerida!=null? (c.efSugerida*100).toFixed(1)+'%':'—'}</div></div>
    <div><div class="stat-label" title="Opcional: si lo deja vacío, se usa la eficiencia ponderada AT-11 sugerida arriba">Eficiencia sistema actual a usar (%)</div><div class="stat-value"><input type="text" class="num" data-key="resultado.efSistemaActualPct"></div></div>
    <div><div class="stat-label">Superficie por Q excedentario (SRQe)</div><div class="stat-value">${fmt(c.SRQe)} ha</div></div>
    <div><div class="stat-label">SNR = SRF − SRA</div><div class="stat-value">${fmt(c.SNR)} ha</div></div>
    <div><div class="stat-label">SENR = SRQe</div><div class="stat-value">${fmt(c.SENR)} ha</div></div>
  </div>
  <div class="card">
    <h3 title="ITT-02 punto 4.5.c: si hay pozo o impulsión nueva, el agua liberada no puede generar superficie excedentaria">¿Incorpora nuevos recursos hídricos?</h3>
    <div class="row"><label>Pozo o impulsión nueva en la situación futura</label><select data-key="resultado.nuevosRecursos"><option value="false" ${!S.resultado.nuevosRecursos?'selected':''}>No</option><option value="true" ${S.resultado.nuevosRecursos?'selected':''}>Sí (fuerza SRQe=0)</option></select></div>
  </div>
  <div class="card">
    <h3>Corrección ERNC (opcional)</h3>
    <div class="row"><label>¿Proyecto ERNC?</label><select data-key="resultado.ernc"><option value="false" ${!S.resultado.ernc?'selected':''}>No</option><option value="true" ${S.resultado.ernc?'selected':''}>Sí</option></select></div>
    ${S.resultado.ernc? `<div class="row"><label>% utilización ERNC (%P)</label><input type="text" class="num" data-key="resultado.pctP"><span>%</span></div>` : ''}
  </div>
  <div class="result">
    <div class="grid2">
      <div>
        <div style="font-size:11px;color:#6b7d90;text-transform:uppercase">Superficie de postulación${S.resultado.ernc?' (con ERNC)':''}</div>
        <div class="big">${fmt(c.postulacionFinal)} ha</div>
      </div>
      <div>
        <div style="font-size:11px;color:#6b7d90;text-transform:uppercase" title="Cuadro N°1 letra b) del Reglamento — factor ${FACTOR_POTENCIALIDAD.toFixed(2)}">Incremento de potencialidad de suelos</div>
        <div class="big">${fmt(c.incrementoPotencialidad)} ha</div>
      </div>
    </div>
    ${c.msgs.length===0? `<div class="badge-ok">✓ sin observaciones</div>` : c.msgs.map(m=>`<div class="msg ${m.t}">${m.t==='err'?'✗':'⚠'} ${m.m}</div>`).join('')}
  </div>
  <div class="card">
    <h3>Chequeo — comparar con valores declarados en el proyecto (SEP)</h3>
    <div class="tablewrap">
    <table class="chk-table">
      <tr><th style="text-align:left">Variable</th><th>Calculado</th><th>Declarado</th><th>Resultado</th></tr>
      ${deltaRow('SRA (ha)', c.SRA, 'declSRA')}
      ${deltaRow('SRF (ha)', c.SRF, 'declSRF')}
      ${deltaRow('SNR (ha)', c.SNR, 'declSNR')}
      ${deltaRow('SENR (ha)', c.SENR, 'declSENR')}
      ${deltaRow('Superficie de postulación (ha)', c.postulacionFinal, 'declPostulacion')}
      ${deltaRow('Incremento potencialidad de suelos (ha)', c.incrementoPotencialidad, 'declIncremento')}
    </table>
    </div>
  </div>`;
}

/* ===================== IMPORT / EXPORT ===================== */
function exportJSON(){
  const data = {formato:'riego-cnr-superficies', version:1, estado:S};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const nombre = (S.codigo||'proyecto').replace(/[^a-zA-Z0-9_-]/g,'_');
  a.href = url; a.download = `Superficies-${nombre}.json`; a.click();
  URL.revokeObjectURL(url);
}
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      S = data.estado || data;
      RAW = {};
      render();
    }catch(err){ alert('No se pudo leer el archivo JSON.'); }
  };
  reader.readAsText(file);
  e.target.value='';
});

/* ===================== NAV ===================== */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{ TAB = Number(t.dataset.tab); RAW={}; render(); });
});

render();
</script>
</body>
