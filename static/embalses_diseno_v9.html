<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseño de Pequeños Embalses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2545; --blue:#1e6091; --ice:#eef4fa; --frost:#f7fafc;
  --line:#d7e2ec; --ink:#14243b; --muted:#5b7086; --white:#ffffff;
  --ok:#1a7f4e; --warn:#b8860b; --bad:#c0392b; --orange:#c9701a;
  --radius:10px; --shadow:0 2px 10px rgba(11,37,69,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --navy:#0b2030; --blue:#4a9bd1; --ice:#152233; --frost:#101b28;
    --line:#26394d; --ink:#e7eef6; --muted:#93a6ba; --white:#182636;
    --ok:#3ecf8e; --warn:#e0b34d; --bad:#e5695a; --orange:#e2984a;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--frost);color:var(--ink);font-family:'Nunito',sans-serif;font-size:14px;}
.topbar{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
.topbar .title{font-weight:800;font-size:16px;letter-spacing:.2px;}
.topbar .sub{font-size:11.5px;opacity:.75;font-family:'DM Mono',monospace;}
.tb-btn{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:6px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.tb-btn:hover{background:rgba(255,255,255,.24);}
.tb-actions{margin-left:auto;display:flex;gap:6px;}
.tabbar{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:40;box-shadow:0 1px 4px rgba(11,37,69,.05);}
.tabs{display:flex;gap:6px;max-width:1180px;margin:0 auto;padding:9px 14px;overflow-x:auto;}
.tab{padding:7px 15px;border-radius:20px;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;font-size:12.8px;user-select:none;white-space:nowrap;transition:background .12s,color .12s;}
.tab:hover{background:var(--ice);color:var(--navy);}
.tab.active{background:var(--navy);color:#fff;}
.wrap{max-width:1180px;margin:0 auto;padding:10px 14px 40px;}
.panel{display:none;}
.panel.active{display:block;}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow);}
.card h2{margin:0 0 6px;font-size:13.5px;color:var(--navy);border-bottom:2px solid var(--ice);padding-bottom:4px;}
.card h3{margin:8px 0 4px;font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}

@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr;}}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:2px 0;border-bottom:1px dashed var(--line);}
.row:last-child{border-bottom:none;}
.row label{font-size:12.8px;color:var(--ink);max-width:66%;}
.row .hint{display:block;font-size:10.8px;color:var(--muted);font-weight:400;}
input[type=number],input[type=text],select{

}

input.result.blue{background:#eaf3fb;}

.btnrow{display:flex;gap:6px;flex-wrap:wrap;}

.typecard{border:2px solid var(--line);border-radius:var(--radius);padding:7px 8px;cursor:pointer;text-align:center;background:var(--white);}
.typecard.sel{border-color:var(--blue);background:var(--ice);}
.typecard .lbl{font-size:12.5px;font-weight:800;color:var(--navy);}
.typecard .desc{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3;}
.fixedrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

.ytlink{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:700;text-decoration:none;font-size:12px;}
.bn-eq{display:flex;gap:8px;}
.bn-eq button{flex:1;background:var(--ice);border:1px solid var(--line);color:var(--navy);font-weight:700;padding:8px;border-radius:8px;cursor:pointer;font-size:12.5px;}

.pricehead label{font-size:12.2px;}
.pricehead input{width:100%;}
.reporthint{font-size:11px;color:var(--muted);margin:6px 0 0;}
#reportView{display:none;}

  @page{size:letter;margin:12mm 12mm;}
  .topbar,.tabbar,.wrap{display:none !important;}
  #reportView{display:block !important;}
  html,body{background:#fff;margin:0;print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  #reportView .diagwrap{background:transparent !important;padding:0 !important;}
  #reportView .basefill{fill:#ffffff !important;}
  #reportView tr{page-break-inside:avoid;}

  #reportView .rep-grid{margin-bottom:2px;}

}

.rep-h1{font-size:18px;font-weight:800;color:var(--navy);margin:0 0 2px;}
.rep-h2{font-size:13.5px;font-weight:800;color:var(--navy);background:var(--ice);padding:6px 10px;border-radius:6px;margin:16px 0 8px;}

.rep-grid div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0;}
.rep-page-break{page-break-before:always;}
</style>

<body>

<div class="topbar">
  <div class="title">💧 Diseño de Pequeños Embalses</div>
  <div class="sub">CNR · DT-18</div>
  <div class="tb-actions">
    <button class="tb-btn" onclick="guardarProyecto()">💾 Guardar</button>
    <button class="tb-btn" onclick="document.getElementById('fileLoad').click()">📂 Cargar</button>
    <input type="file" id="fileLoad" accept="application/json,.json" style="display:none" onchange="cargarProyecto(this)">
  </div>
</div>
<div class="tabbar"><div class="tabs" id="tabs"></div></div>
<div class="wrap" id="app"></div>
<div id="reportView"></div>

<script>
/* ===================== CONSTANTES FIJAS (CNR) ===================== */
const TALUD_TXT = 'V:H 1:1,5';
const ANCHO_COR = 2;      // Ancho coronamiento (m) - fijo
const REVANCHA  = 0.3;    // Revancha (m) - fijo
const UF_BASE   = 24063.5;
const VOL_OPTS  = [100,200,300,400,500,600,700,800,900,1000];
const ALT_OPTS  = [1,1.5,2,2.5];
const LARGO_OPTS= [5,10,15,20,25];
const YT_URL = 'https://youtu.be/_FExUpzFkOM?si=JaO67Dd_O7j2u0hK';

/* ===================== FORMATO CHILENO ===================== */
function fmt(n,dec=2){
  if(n===null||n===undefined||isNaN(n)) return '';
  return n.toLocaleString('es-CL',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmt0(n){ return fmt(n,0); }
function parseDecimalFlex(v){
  if(typeof v==='number') return v;
  if(!v) return NaN;
  let s = String(v).trim().replace(/\s/g,'');
  const hasComma = s.includes(','), hasDot = s.includes('.');
  if(hasComma && hasDot){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
  } else if(hasComma){ s = s.replace(',','.'); }
  const n = parseFloat(s);
  return isNaN(n) ? NaN : n;
}

/* ===================== ESTADO ===================== */
const DEFAULT_PRECIOS = {
  altura:500, acceso:'Plano', uf:40873.77, transporte:150, ufFecha:'31-08-2026',
  manoObra:{capatazMin:20142,capatazMax:21535,jornalMin:10187,jornalMax:10187},
  maquinaria:{retroMin:16000,retroMax:17029,placaMin:15000,placaMax:19556,
    tolvaMin:145000,tolvaMax:160000,rodilloMin:37000,rodilloMax:50000,
    aguaMin:47501,aguaMax:50000,estanqueMin:8500,estanqueMax:9500},
  fijos:{emprestitoMin:4850,emprestitoMax:5130,geoMin:2480,geoMax:2750,cercoMin:9750,cercoMax:10200}
};
const RENDS = { // [min,max] base (antes de factor altura), unidad indicada
  excMaquina:[9,12,'hr'], excMano:[2,2.5,'dia'], seleccion:[9.5,12,'hr'],
  compactacion:[56,70,'hr'], transporte:[82,102,'dia'], manejo:[163,204,'dia'],
  relleno:[15,20,'dia']
};

let S = {
  d:{ caudal:10, tturno:24, tipo:'100% Muro', geomembrana:'Si', profExc:1.5,
      volumen:900, alturaSel:2, largoCalc:15, largoDis:15, anchoDis:30 },
  precios: JSON.parse(JSON.stringify(DEFAULT_PRECIOS)),
  presupuesto: {}, // overrides manuales de P.U. por item id
  chequeo: { freqTurno:1, tipoSistema:'alta', caudalSistema:5, horasDia:2,
             horasPostura:8, horasCiclo:16, frRiego:7 }
};
let RAW = {}; // eco del texto tal como se está tecleando (evita perder "," "." mientras se escribe)

function loadState(){
  RAW = {};
  try{
    const raw = localStorage.getItem('embalse_cnr_v1');
    if(raw){
      const obj = JSON.parse(raw);
      if(obj.d) Object.assign(S.d, obj.d);
      if(obj.precios) S.precios = obj.precios;
      if(obj.presupuesto) S.presupuesto = obj.presupuesto;
      if(obj.chequeo) Object.assign(S.chequeo, obj.chequeo);
    }
  }catch(e){ console.warn('No se pudo cargar estado guardado', e); }
}
function saveState(){
  try{ localStorage.setItem('embalse_cnr_v1', JSON.stringify(S)); }catch(e){}
}

function guardarProyecto(){
  const nombre = prompt('Nombre del proyecto (se usará en el nombre del archivo):', S.d.nombreProyecto||'');
  if(nombre===null) return;
  const safe = (nombre.trim()||'SinNombre').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_');
  S.d.nombreProyecto = nombre.trim();
  saveState();
  const data = { formato:'riego-cnr-embalse', version:1, fecha:new Date().toISOString(),
    d:S.d, precios:S.precios, presupuesto:S.presupuesto, chequeo:S.chequeo };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `MiniEmbalse_${safe}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function cargarProyecto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const obj = JSON.parse(e.target.result);
      if(obj.d) Object.assign(S.d, obj.d);
      if(obj.precios) S.precios = obj.precios;
      if(obj.presupuesto) S.presupuesto = obj.presupuesto;
      if(obj.chequeo) Object.assign(S.chequeo, obj.chequeo);
      RAW = {};
      saveState(); render();
      alert('Proyecto cargado correctamente.');
    }catch(err){ alert('No se pudo leer el archivo: '+err.message); }
  };
  reader.readAsText(file);
  input.value='';
}

/* ===================== MOTOR DISEÑO ===================== */
function calcDiseno(){
  const d = S.d;
  const volDisponible = d.tturno*3600*d.caudal/1000;
  const h = d.alturaSel - REVANCHA; // NAM
  const acRoot = Math.sqrt(d.volumen/h - 2.25*h*h) - 1.5*h;
  const areaBaseNecesaria = Math.floor(acRoot*acRoot);
  const anchoRecom = areaBaseNecesaria/d.largoCalc;

  const largoTopeMuro = d.largoDis + 3*d.alturaSel;   // D30
  const anchoTopeMuro = d.anchoDis + 3*d.alturaSel;   // D31

  let alturaMuro;
  if(d.tipo==='Excavación y Muro') alturaMuro = d.alturaSel - d.profExc;
  else if(d.tipo==='100% Excavado') alturaMuro = null; // "Sin Muro"
  else alturaMuro = d.alturaSel;

  const areaBaseReal = d.largoDis*d.anchoDis;              // D34
  const areaNAM = (d.largoDis+3*h)*(d.anchoDis+3*h);       // D35
  const areaTopeMuro = largoTopeMuro*anchoTopeMuro;        // D36
  const volumenDiseno = ((areaBaseReal+areaNAM)/2)*h;      // D37
  const largoCerco = largoTopeMuro+5;                      // D38
  const anchoCerco = anchoTopeMuro+5;                      // D39

  const AC48 = 2*(largoTopeMuro+3) + 2*(anchoTopeMuro+3);  // perímetro al eje
  const AC50 = ANCHO_COR*d.alturaSel + 1.5*d.alturaSel*d.alturaSel; // área muro (100% Muro)

  let excavacion=0, relleno=0;
  if(d.tipo==='Excavación y Muro'){
    const AD53 = 3*d.profExc + d.anchoDis;
    const AE53 = 3*d.profExc + d.largoDis;
    const AF53 = AD53*AE53;
    excavacion = ((AF53+areaBaseReal)/2)*d.profExc;
    const AB56 = d.alturaSel - d.profExc;
    const AC55 = ANCHO_COR*AB56 + 1.5*AB56*AB56;
    relleno = AC55*AC48;
  } else if(d.tipo==='100% Excavado'){
    excavacion = ((areaBaseReal+areaTopeMuro)/2)*d.alturaSel;
    relleno = 0;
  } else { // 100% Muro
    excavacion = 0;
    relleno = AC48*AC50;
  }

  const tteBotadero = excavacion - relleno;          // AC65
  const emprestito  = tteBotadero<0 ? -tteBotadero : 0; // AC67

  // Geomembrana
  let areaGeomembrana=0, zanjaAnclaje=0;
  if(d.geomembrana==='Si'){
    const AC60 = Math.sqrt(d.alturaSel*d.alturaSel + (1.5*d.alturaSel)*(1.5*d.alturaSel)) + 2;
    const perimBase = 2*d.largoDis + 2*d.anchoDis;
    areaGeomembrana = ((AC48+perimBase)/2)*AC60 + areaBaseReal;
    zanjaAnclaje = AC48*0.25;
  }

  return {
    volDisponible, h, areaBaseNecesaria, anchoRecom, largoTopeMuro, anchoTopeMuro,
    alturaMuro, areaBaseReal, areaNAM, areaTopeMuro, volumenDiseno, largoCerco, anchoCerco,
    excavacion, relleno, tteBotadero, emprestito, areaGeomembrana, zanjaAnclaje,
    alertVolumen: d.volumen > volDisponible*1.2,
    alertProf: d.tipo!=='100% Excavado' && d.profExc>=d.alturaSel,
    alertLargo: d.largoDis>d.largoCalc*1.15 ? 'exceso' : (d.largoDis<d.largoCalc ? 'menor' : null),
    alertAncho: d.anchoDis>anchoRecom*1.15 ? 'exceso' : (d.anchoDis<anchoRecom ? 'menor' : null)
  };
}

/* ===================== CUBICACIÓN ===================== */
function calcCubicacion(){
  const R = calcDiseno();
  const d = S.d;
  const F17 = d.tipo==='100% Muro' ? R.relleno : R.emprestito;
  const F12 = F17>0 ? (R.relleno-F17) : R.relleno;
  const tteBot = R.tteBotadero<0 ? 0 : R.tteBotadero;
  return {
    R,
    excMaquina: R.excavacion,
    seleccion: F12,
    colocacion: R.relleno,
    compactacion: R.relleno,
    tteBotadero: tteBot,
    manejoBotadero: tteBot,
    emprestito: F17,
    excManoZanja: d.geomembrana==='Si' ? R.zanjaAnclaje : 0,
    geomembranaM2: d.geomembrana==='Si' ? R.areaGeomembrana : 0,
    rellenoZanja: d.geomembrana==='Si' ? R.zanjaAnclaje : 0,
    cercoM: 2*(R.largoCerco+R.anchoCerco)
  };
}

/* ===================== MOTOR DE PRECIOS APU DT-18 ===================== */
function alturaFactor(altura){
  return altura<=1000 ? 1 : (110-0.01*altura)/100;
}
function accesoFactor(acceso){
  if(acceso==='Ladera Media') return 1.02;
  if(acceso==='Difícil Acceso') return 1.05*1.02;
  return 1;
}
function adjYield(base, factor){ return Math.round(base*factor*10)/10; }

// Fórmulas de costo unitario (replican exactamente Mov. Tierras $min/$max)
function fExcMaquina(rend,jornal,capataz,retro){
  const c1=retro/rend, c2=jornal/(rend*8.5), c3=capataz/(rend*2*8.5);
  return c1+c2+c3+0.57*(c2+c3);
}
function fExcMano(rend,jornal,capataz){
  const c1=jornal/rend, recargo=0.10*c1, c3=capataz/(rend*12);
  return c1+recargo+c3+0.57*(c1+c3);
}
function fSeleccion(rend,jornal,capataz,retro){
  const c1=retro/rend, e76=rend*8.5, c2=jornal/e76, e78=e76/0.75, c3=capataz/e78;
  return c1+c2+c3+0.57*(c2+c3);
}
function fColocacionTolva(rend,jornal,capataz,tolva){
  const c1=tolva/(8*rend), e100=rend*8.5/0.5, c2=jornal/e100, e102=e100*0.5/0.75, c3=capataz/e102;
  const recargo=0.10*c2;
  return c1+c2+c3+recargo+0.57*(c3+c2);
}
function fCompactacion(rend,jornal,capataz,rodillo,agua){
  const c1=rodillo/rend, e126=rend*8.5, c2=agua/e126, e129=e126, c3=jornal/e129;
  const e130=e129/7, c4=jornal/e130, recargo=0.10*(c3+c4), c5=capataz/e129;
  return c1+c2+c3+c4+recargo+c5+0.57*(c5+c4+c3);
}
function fTransporteTipo(rend,jornal,capataz,tolva){ // usado en transporte y manejo botadero
  const c1=tolva/rend, c2=jornal/rend, c3=capataz/(rend*3);
  return c1+c2+c3+0.57*(c3+c2);
}
function fRellenoComun(rend,jornal,capataz,placa,estanque){
  const e156=rend/1.5, c1=jornal/e156, recargo1=0.10*c1;
  const e159=rend*1.2, c2=placa/e159, e161=e159*5, c3=estanque/e161;
  const e162=e159, c4=jornal/e162, recargo2=0.10*c4;
  const e164=e162*3, c5=capataz/e164;
  return c1+recargo1+c2+c3+c4+recargo2+c5+0.57*(c5+c4+c1);
}

function calcPreciosAPU(){
  const p = S.precios;
  const f = alturaFactor(p.altura);
  const acc = accesoFactor(p.acceso);
  const ufScale = p.uf/UF_BASE;
  const mo = p.manoObra, mq = p.maquinaria;

  function runItem(key, formulaFn, extraArgsMin, extraArgsMax){
    const [bmin,bmax] = RENDS[key];
    const adjMax = adjYield(bmax,f); // mejor rendimiento -> escenario precio MIN
    const adjMin = adjYield(bmin,f); // peor rendimiento -> escenario precio MAX
    const pMin = formulaFn(adjMax, ...extraArgsMin);
    const pMax = formulaFn(adjMin, ...extraArgsMax);
    const min = pMin*ufScale*acc, max = pMax*ufScale*acc;
    return {min, max, prom:(min+max)/2};
  }

  const excMaquina = runItem('excMaquina', fExcMaquina,
    [mo.jornalMin, mo.capatazMin, mq.retroMin], [mo.jornalMax, mo.capatazMax, mq.retroMax]);
  const excMano = (()=>{
    const [bmin,bmax]=RENDS.excMano;
    const adjMax=adjYield(bmax,f), adjMin=adjYield(bmin,f);
    const pMin=fExcMano(adjMax, mo.jornalMin, mo.capatazMin);
    const pMax=fExcMano(adjMin, mo.jornalMax, mo.capatazMax);
    const min=pMin*ufScale*acc, max=pMax*ufScale*acc;
    return {min,max,prom:(min+max)/2};
  })();
  const seleccion = runItem('seleccion', fSeleccion,
    [mo.jornalMin, mo.capatazMin, mq.retroMin], [mo.jornalMax, mo.capatazMax, mq.retroMax]);
  const compactacionR = runItem('compactacion', fCompactacion,
    [mo.jornalMin, mo.capatazMin, mq.rodilloMin, mq.aguaMin],
    [mo.jornalMax, mo.capatazMax, mq.rodilloMax, mq.aguaMax]);
  const transp = runItem('transporte', fTransporteTipo,
    [mo.jornalMin, mo.capatazMin, mq.tolvaMin], [mo.jornalMax, mo.capatazMax, mq.tolvaMax]);
  const manejo = runItem('manejo', fTransporteTipo,
    [mo.jornalMin, mo.capatazMin, mq.tolvaMin], [mo.jornalMax, mo.capatazMax, mq.tolvaMax]);
  const rellenoC = runItem('relleno', fRellenoComun,
    [mo.jornalMin, mo.capatazMin, mq.placaMin, mq.estanqueMin],
    [mo.jornalMax, mo.capatazMax, mq.placaMax, mq.estanqueMax]);

  // colocación camión tolva: rendimientos fijos (no dependen del factor altura)
  const colMinP = fColocacionTolva(16, mo.jornalMin, mo.capatazMin, mq.tolvaMin);
  const colMaxP = fColocacionTolva(11, mo.jornalMax, mo.capatazMax, mq.tolvaMax);
  const colocacion = { min: colMinP*ufScale*acc, max: colMaxP*ufScale*acc };
  colocacion.prom = (colocacion.min+colocacion.max)/2;

  // ítems de precio fijo (no dependen de UF/altura/acceso, editables directamente)
  const fj = p.fijos;
  const emprestito = { min:fj.emprestitoMin, max:fj.emprestitoMax, prom:(fj.emprestitoMin+fj.emprestitoMax)/2 };
  const geomembrana = { min:fj.geoMin, max:fj.geoMax, prom:(fj.geoMin+fj.geoMax)/2 };
  const cerco = { min:fj.cercoMin, max:fj.cercoMax, prom:(fj.cercoMin+fj.cercoMax)/2 };

  return { excMaquina, excMano, seleccion, colocacion, compactacionR, transp, manejo, rellenoC,
           emprestito, geomembrana, cerco };
}

function precioItem(id, promDefault){

}
function calcPresupuesto(){
  const C = calcCubicacion();
  const P = calcPreciosAPU();
  const rows = [
    {id:'excMaquina', item:'1.1', desc:'Excavación con Máquina', unidad:'m³', cant:C.excMaquina, pu:P.excMaquina.prom},
    {id:'seleccion',  item:'1.2', desc:'Selección de Material y acopio para terraplenes', unidad:'m³', cant:C.seleccion, pu:P.seleccion.prom},
    {id:'colocacion', item:'1.3', desc:'Colocación de Material con camión tolva (material excavado en poza)', unidad:'m³', cant:C.colocacion, pu:P.colocacion.prom},
    {id:'compactacion',item:'1.4', desc:'Compactación rodillada de terraplenes por capas controladas', unidad:'m³', cant:C.compactacion, pu:P.compactacionR.prom},
    {id:'tteBotadero', item:'1.5', desc:'Transporte a Botadero (5 km)', unidad:'m³', cant:C.tteBotadero, pu:P.transp.prom},
    {id:'manejoBotadero',item:'1.6', desc:'Manejo de Excedentes / Botadero', unidad:'m³', cant:C.manejoBotadero, pu:P.manejo.prom},
    {id:'emprestito', item:'1.7', desc:'Material de Empréstito', unidad:'m³', cant:C.emprestito, pu:P.emprestito.prom},
    {id:'excManoZanja',item:'2.1', desc:'Excavación a Mano (zanja de anclaje)', unidad:'m³', cant:C.excManoZanja, pu:P.excMano.prom},
    {id:'geomembrana', item:'2.2', desc:'Instalación de Geomembrana', unidad:'m²', cant:C.geomembranaM2, pu:P.geomembrana.prom},
    {id:'rellenoZanja',item:'2.3', desc:'Relleno Común (zanja de anclaje)', unidad:'m³', cant:C.rellenoZanja, pu:P.rellenoC.prom},
    {id:'cerco',      item:'3.1', desc:'Cerco Perimetral', unidad:'m', cant:C.cercoM, pu:P.cerco.prom},
  ];
  let total=0;
  rows.forEach(r=>{
    r.puFinal = precioItem(r.id, r.pu);
    r.total = (r.cant>0) ? r.cant*r.puFinal : 0;
    total += r.total;
  });
  return {rows, total};
}

/* ===================== CHEQUEO SISTEMA DE RIEGO ===================== */
function calcChequeo(){
  const R = calcDiseno();
  const d = S.d;
  const c = S.chequeo;
  const volDiseno = R.volumenDiseno;           // capacidad física construida (m³)
  const volAporteTurno = R.volDisponible;      // lo que la fuente llena en UN turno (m³)
  const tasaDiaria = c.freqTurno>0 ? volAporteTurno/c.freqTurno : 0; // aporte promedio de la fuente por día (m³/día)

  const esAlta = c.tipoSistema==='alta';
  let volEvento, demandaDiariaProm, autonomiaUnidadTxt, autonomiaCant;

  if(esAlta){
    volEvento = c.caudalSistema*c.horasDia*3.6;          // m³ por día de riego
    demandaDiariaProm = volEvento;                        // ya es diario
  } else {
    volEvento = c.caudalSistema*c.horasPostura*3.6;       // m³ por postura (evento más grande)
    const volCiclo = c.caudalSistema*c.horasCiclo*3.6;    // m³ consumidos en un ciclo de Fr días
    demandaDiariaProm = c.frRiego>0 ? volCiclo/c.frRiego : 0;
  }

  const horasContinuas = c.caudalSistema>0 ? volDiseno/(c.caudalSistema*3.6) : 0; // autonomía en horas de riego continuo
  if(esAlta){
    autonomiaCant = c.horasDia>0 ? horasContinuas/c.horasDia : 0;
    autonomiaUnidadTxt = 'días de riego';
  } else {
    autonomiaCant = c.horasCiclo>0 ? horasContinuas/c.horasCiclo : 0;
    autonomiaUnidadTxt = 'ciclos de Fr completos';
  }

  return {
    volDiseno, volAporteTurno, tasaDiaria,
    volEvento, demandaDiariaProm, horasContinuas, autonomiaCant, autonomiaUnidadTxt,
    capacidadOk: volEvento <= volDiseno,
    balanceOk: tasaDiaria >= demandaDiariaProm,
    margenCapacidad: volDiseno>0 ? (volDiseno-volEvento)/volDiseno*100 : 0,
    margenBalance: demandaDiariaProm>0 ? (tasaDiaria-demandaDiariaProm)/demandaDiariaProm*100 : 0
  };
}

function diagramaSVG(R){
  const d=S.d;
  const Ltop = R.largoTopeMuro, Atop = R.anchoTopeMuro;   // exterior (coronamiento)
  const swap = Atop > Ltop; // el lado más largo siempre queda horizontal
  const L = swap ? Atop : Ltop;
  const A = swap ? Ltop : Atop;
  const bl = swap ? d.anchoDis : d.largoDis;   // horizontal interior
  const ba = swap ? d.largoDis : d.anchoDis;   // vertical interior
  const labelH = swap ? 'Ancho' : 'Largo';
  const labelV = swap ? 'Largo' : 'Ancho';
  const VBW=470, VBH=250;
  const padTop=30, padBottom=34, padLeft=54, padRight=34;
  const availW = VBW-padLeft-padRight, availH = VBH-padTop-padBottom;
  const scale = Math.min(availW/Math.max(L,0.1), availH/Math.max(A,0.1));
  const W = L*scale, H = A*scale;
  const w = bl*scale, h2 = ba*scale;
  const ox = padLeft + (availW-W)/2, oy = padTop + (availH-H)/2;
  const bw=(W-w)/2, bh=(H-h2)/2;
  const dimTop = oy-12, dimLeft = ox-12;
  return `<svg viewBox="0 0 ${VBW} ${VBH}" style="width:100%;height:auto;display:block;max-height:250px" preserveAspectRatio="xMidYMid meet">
    <rect x="${ox}" y="${oy}" width="${W}" height="${H}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect class="basefill" x="${ox+bw}" y="${oy+bh}" width="${w}" height="${h2}" stroke="var(--blue)" stroke-width="2.5"/>
    <line x1="${ox}" y1="${dimTop}" x2="${ox+W}" y2="${dimTop}" stroke="var(--muted)" stroke-width="1"/>
    <line x1="${ox}" y1="${dimTop-4}" x2="${ox}" y2="${dimTop+4}" stroke="var(--muted)" stroke-width="1"/>
    <line x1="${ox+W}" y1="${dimTop-4}" x2="${ox+W}" y2="${dimTop+4}" stroke="var(--muted)" stroke-width="1"/>
    <text x="${ox+W/2}" y="${dimTop-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="DM Mono">Coronamiento ${fmt(L,1)} m</text>
    <line x1="${dimLeft}" y1="${oy}" x2="${dimLeft}" y2="${oy+H}" stroke="var(--muted)" stroke-width="1"/>
    <text x="${dimLeft-6}" y="${oy+H/2}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="DM Mono" transform="rotate(-90 ${dimLeft-6} ${oy+H/2})">Coronamiento ${fmt(A,1)} m</text>
    <text x="${ox+bw+w/2}" y="${oy+bh+h2+16}" text-anchor="middle" font-size="10.5" fill="var(--navy)" font-family="DM Mono" font-weight="700">${labelH} Base ${fmt(bl,1)} m</text>
    <text x="${ox+bw+w+16}" y="${oy+bh+h2/2}" text-anchor="middle" font-size="10.5" fill="var(--navy)" font-family="DM Mono" font-weight="700" transform="rotate(-90 ${ox+bw+w+16} ${oy+bh+h2/2})">${labelV} Base ${fmt(ba,1)} m</text>
  </svg>`;
}

function renderCubicacion(){
  const C = calcCubicacion();
  const d = S.d;
  const rows = [
    ['1','MOVIMIENTO DE TIERRAS','','',null,true],
    ['1.1','Excavación con Máquina','m³',C.excMaquina],
    ['1.2','Selección de Material y acopio para terraplenes','m³',C.seleccion],
    ['1.3','Colocación de Material con camión tolva','m³',C.colocacion],
    ['1.4','Compactación rodillada de terraplenes por capas controladas','m³',C.compactacion],
    ['1.5','Transporte a Botadero (5 km)','m³',C.tteBotadero],
    ['1.6','Manejo de Excedentes / Botadero','m³',C.manejoBotadero],
    ['1.7','Material de Empréstito','m³',C.emprestito],
    ['2','IMPERMEABILIZACIÓN','','',null,true],
    ['2.1','Excavación a Mano (zanja de anclaje)','m³',C.excManoZanja],
    ['2.2','Instalación de Geomembrana','m²',C.geomembranaM2],
    ['2.3','Relleno Común (zanja de anclaje)','m³',C.rellenoZanja],
    ['3','CIERRE PERIMETRAL','','',null,true],
    ['3.1','Cerco perimetral','m',C.cercoM],
  ];
  // Oculta ítems sin cantidad; oculta también el encabezado de grupo si ningún ítem del grupo tiene datos
  const withVisibility = rows.map((r,i)=>({r, visible: r[5] ? null : (r[3]>0)}));
  for(let i=0;i<withVisibility.length;i++){
    if(withVisibility[i].r[5]){
      let any=false;
      for(let j=i+1;j<withVisibility.length && !withVisibility[j].r[5];j++){ if(withVisibility[j].visible) any=true; }
      withVisibility[i].visible = any;
    }
  }
  const visibleRows = withVisibility.filter(x=>x.visible).map(x=>x.r);
  return `<div class="card">
    <h2>Cubicación</h2>
    <div class="small" style="margin-bottom:8px;">Tipo de embalse: <span class="tag">${d.tipo}</span> · Geomembrana: <span class="tag">${d.geomembrana}</span></div>
    <table><thead><tr><th>Ítem</th><th style="text-align:left">Designación</th><th>Unidad</th><th>Cantidad</th></tr></thead>
    <tbody>${visibleRows.map(r=>{
      if(r[5]) return `<tr class="grp"><td>${r[0]}</td><td colspan="3">${r[1]}</td></tr>`;
      return `<tr><td class="center">${r[0]}</td><td class="desc">${r[1]}</td><td class="center">${r[2]}</td><td>${fmt(r[3],2)}</td></tr>`;
    }).join('')}</tbody></table>
    ${visibleRows.length===0 ? '<div class="small">Sin cantidades calculadas todavía.</div>' : ''}
  </div>`;
}

  const {rows,total} = calcPresupuesto();
  const groups = [
    {ids:['excMaquina','seleccion','colocacion','compactacion','tteBotadero','manejoBotadero','emprestito'], label:'1 · MOVIMIENTO DE TIERRAS'},
    {ids:['excManoZanja','geomembrana','rellenoZanja'], label:'2 · IMPERMEABILIZACIÓN CON GEOMEMBRANA'},
    {ids:['cerco'], label:'3 · CIERRE PERIMETRAL'},
  ];
  const byId = Object.fromEntries(rows.map(r=>[r.id,r]));
  const bodyHtml = groups.map(g=>{
    const grpRow = `<tr class="grp"><td colspan="6">${g.label}</td></tr>`;
    const itemRows = g.ids.map(id=>{
      const r = byId[id]; if(!r) return '';
      return `<tr>
        <td class="center">${r.item}</td><td class="desc">${r.desc}</td><td class="center">${r.unidad}</td>
        <td>${fmt(r.cant,2)}</td>
        <td><input class="pu-input" data-key="pres-${r.id}" value="${rawOr('pres-'+r.id,fmt0(r.puFinal))}" oninput="setPresupuesto('${r.id}',this.value)"></td>
        <td>${fmt0(r.total)}</td>
      </tr>`;
    }).join('');
    return grpRow+itemRows;
  }).join('');
  return `<div class="card">
    <h2>Presupuesto Detallado de las Obras</h2>
    <table><thead><tr><th>Ítem</th><th style="text-align:left">Designación</th><th>Unidad</th><th>Cantidad</th><th>P.U. ($)</th><th>Total ($)</th></tr></thead>
    <tbody>${bodyHtml}</tbody>
    <tfoot><tr><td colspan="5" style="text-align:right">COSTO DIRECTO</td><td>${fmt0(total)}</td></tr></tfoot>
    </table>
    <div class="footer-note">Los P.U. se pueden editar manualmente por ítem. Por defecto se usa el precio promedio calculado en la pestaña "Precios DT-18".
    <br>Nota: a diferencia de la planilla original (que por un error de rango de suma excluye el cerco perimetral del Costo Directo), aquí el total sí incluye todos los ítems cubicados.</div>
  </div>`;
}

function setP(path, val){
  RAW['p-'+path] = val;
  const parts = path.split('.');
  let obj = S.precios;
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = parseDecimalFlex(val);
  saveState(); render();
}
function setPresupuesto(id, val){
  RAW['pres-'+id] = val;
  S.presupuesto[id] = val;
  saveState(); render();
}
function resetPrecios(){
  if(confirm('¿Restablecer todos los precios base del DT-18 a los valores originales?')){
    S.precios = JSON.parse(JSON.stringify(DEFAULT_PRECIOS));
    S.presupuesto = {};
    RAW = {};
    saveState(); render();
  }
}

function priceField(label,pathMin,pathMax,valMin,valMax){
  return `<div class="pricehead">
    <label>${label}</label>
    <input class="pu-input" data-key="p-${pathMin}" value="${rawOr('p-'+pathMin,valMin)}" oninput="setP('${pathMin}',this.value)">
    <input class="pu-input" data-key="p-${pathMax}" value="${rawOr('p-'+pathMax,valMax)}" oninput="setP('${pathMax}',this.value)">
  </div>`;
}

  return ok ? `<span class="alert" style="background:#eafaf1;color:var(--ok)">✓ ${txtOk}</span>`
            : `<span class="alert bad">✗ ${txtBad}</span>`;
}

function render(){
  // preservar foco/cursor del input que se esté editando (evita perder el foco al re-renderizar)
  const active = document.activeElement;
  let fKey=null, fSelS=null, fSelE=null;
  if(active && active.getAttribute && active.getAttribute('data-key')){
    fKey = active.getAttribute('data-key');
    if(typeof active.selectionStart === 'number'){ fSelS=active.selectionStart; fSelE=active.selectionEnd; }
  }
  renderTabs();
  const app = document.getElementById('app');
  if(activeTab==='diseno') app.innerHTML = renderDiseno();
  else if(activeTab==='cubicacion') app.innerHTML = renderCubicacion();
  else if(activeTab==='presupuesto') app.innerHTML = renderPresupuesto();
  else if(activeTab==='precios') app.innerHTML = renderPrecios();
  else if(activeTab==='informe') app.innerHTML = renderInforme();
  else if(activeTab==='chequeo') app.innerHTML = renderChequeo();
  else document.getElementById('reportView').innerHTML = renderInformeContent();
  if(fKey){
    const sel = '[data-key="'+fKey.replace(/"/g,'\\"')+'"]';
    const el = document.querySelector(sel);
    if(el){
      el.focus();
      if(fSelS!=null && el.setSelectionRange){ try{ el.setSelectionRange(fSelS,fSelE); }catch(e){} }
    }
  }
}

loadState();
render();
</script>
