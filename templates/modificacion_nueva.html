{% extends "base.html" %}
{% block title %}Nueva Modificación de Proyecto — Revisor CNR{% endblock %}
{% block content %}

<div class="flex items-center gap-2 mt-2" style="margin-bottom:1.5rem">
  <a href="/modificaciones" class="btn btn-outline btn-sm">← Volver</a>
  <h1 style="font-size:1.4rem; color:#1a365d;">Registrar modificación de proyecto</h1>
</div>

<div class="card" style="max-width:600px;">
  <h2>Antecedentes de la modificación</h2>
  <form method="post" action="/modificacion/nueva">
    <div class="form-group">
      <label>Código SEP de la modificación</label>
      <input type="text" name="codigo_sep" placeholder="Ej: 204-2026-16-003-MOD1" required
             style="font-family:monospace; letter-spacing:1px;">
    </div>
    <div class="form-group">
      <label>Código SEP del proyecto original</label>
      <input type="text" name="codigo_sep_original" placeholder="Ej: 204-2026-16-003"
             style="font-family:monospace; letter-spacing:1px;">
      <p class="text-muted mt-1">El proyecto ya bonificado al que corresponde esta modificación.</p>
    </div>
    <div class="form-group">
      <label>Nombre del proyecto</label>
      <input type="text" name="nombre_proyecto" placeholder="Ej: Sistema de riego tecnificado Los Aromos" required>
    </div>
    <div class="form-group">
      <label>Nombre del postulante</label>
      <input type="text" name="postulante" placeholder="Nombre o razón social" required>
    </div>
    <div class="form-group">
      <label>Tipo de modificación</label>
      <select name="tipo_modificacion" style="width:100%; padding:0.5rem 0.6rem; border:1px solid var(--border); border-radius:6px;">
        <option value="">— Seleccionar —</option>
        {% for key, label in tipos_modificacion.items() %}
        <option value="{{ key }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Crear modificación</button>
  </form>
</div>

{% endblock %}
