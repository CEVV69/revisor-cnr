<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisor CNR — Ingreso</title>

  <!-- PWA: manifest + íconos, para que el navegador ofrezca "Instalar app" desde el login -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2b6cb0">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Revisor CNR">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .login-box {
      background: white; border-radius: 18px; padding: 2.5rem 2.2rem;
      width: 360px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 16px 48px rgba(0,0,0,0.08);
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo h1 { font-size: 1.6rem; font-weight: 700; color: #1d1d1f; letter-spacing: -0.02em; }
    .logo h1 span { color: #0071e3; }
    .logo p { color: #6e6e73; font-size: 0.82rem; margin-top: 0.3rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.78rem; font-weight: 500; color: #6e6e73; margin-bottom: 0.3rem; }
    input {
      width: 100%; padding: 0.6rem 0.9rem;
      border: 1px solid rgba(0,0,0,0.14); border-radius: 8px;
      font-size: 0.92rem; color: #1d1d1f; background: white;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0,113,227,0.14); }
    .btn-login {
      width: 100%; padding: 0.7rem;
      background: #0071e3; color: white; border: none;
      border-radius: 980px; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; margin-top: 0.6rem; font-family: inherit;
      transition: background .15s;
    }
    .btn-login:hover { background: #0077ed; }
    .btn-login:active { opacity: 0.8; }
    .alert {
      background: #fff0f0; color: #c41230;
      padding: 0.65rem 0.9rem; border-radius: 8px;
      font-size: 0.83rem; margin-bottom: 1rem;
      border: 1px solid rgba(196,18,48,.18);
    }
    .footer { text-align: center; margin-top: 1.5rem; color: #86868b; font-size: 0.76rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>Revisor <span>CNR</span></h1>
      <p>Ley N° 18.450 — Uso interno</p>
    </div>
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Tu usuario" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
      </div>
      <button type="submit" class="btn-login">Ingresar</button>
    </form>
    <div class="footer">Comisión Nacional de Riego</div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/static/sw.js');
      });
    }
  </script>
</body>
</html>
